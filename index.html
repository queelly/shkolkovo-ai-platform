<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ШКОЛКОВО · Интерактивный тренажёр олимпиадных задач (8–11 класс)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  <!-- KaTeX CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" crossorigin="anonymous">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>

  <style>
    :root {
      --shk-blue: #0085FF;
      --shk-blue-hover: #006CD1;
      --shk-blue-light: #EBF5FF;
      --shk-navy: #0B192C;
      --shk-slate-bg: #DFE4EC;
      --shk-page-bg: #FFFFFF;
      --shk-card-bg: #FFFFFF;
      --shk-subtle-bg: #F4F6FA;
      --shk-text: #0F172A;
      --shk-text-sec: #475467;
      --shk-text-muted: #64748B;
      --shk-border: #E4E7EC;
      --shk-green: #10B981;
      --shk-green-soft: #ECFDF5;
      --shk-red: #F04438;
      --shk-red-soft: #FEF3F2;
      --shk-amber: #F59E0B;
      --shk-amber-soft: #FFFBEB;
      --radius-card: 22px;
    }

    body.dark-mode {
      --shk-page-bg: #0B111E;
      --shk-slate-bg: #111827;
      --shk-card-bg: #1E293B;
      --shk-subtle-bg: #0F172A;
      --shk-text: #F8FAFC;
      --shk-text-sec: #CBD5E1;
      --shk-text-muted: #94A3B8;
      --shk-border: #334155;
      --shk-blue-light: rgba(0, 133, 255, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--shk-slate-bg);
      color: var(--shk-text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* =====================================================================
       1. SHKOLKOVO HEADER (5 SECTIONS NAVIGATION)
       ===================================================================== */
    .shk-header {
      background: var(--shk-card-bg);
      border-bottom: 1px solid var(--shk-border);
      height: 66px;
      padding: 0 28px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .shk-header-inner {
      max-width: 1480px;
      height: 100%;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .shk-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--shk-text);
      flex-shrink: 0;
    }

    .shk-logo-word {
      font-weight: 900;
      font-size: 18px;
      letter-spacing: 0.06em;
      color: var(--shk-text);
    }

    .section-nav {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
    }

    .sec-btn {
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--shk-text-sec);
      background: transparent;
      border: none;
      padding: 8px 14px;
      border-radius: 10px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.16s ease;
    }

    .sec-btn:hover {
      background: var(--shk-subtle-bg);
      color: var(--shk-blue);
    }

    .sec-btn.active {
      background: var(--shk-blue);
      color: #FFFFFF;
      box-shadow: 0 3px 10px rgba(0, 133, 255, 0.25);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .shk-theme-pill {
      background: #E4E7EC;
      border-radius: 12px;
      padding: 4px;
      display: flex;
      align-items: center;
      gap: 2px;
      cursor: pointer;
      border: none;
    }

    body.dark-mode .shk-theme-pill {
      background: #334155;
    }

    .shk-theme-opt {
      width: 28px;
      height: 24px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .shk-theme-opt.active {
      background: #FFFFFF;
    }

    body.dark-mode .shk-theme-opt.active {
      background: #0F172A;
    }

    /* =====================================================================
       2. SLATE WORKSPACE CONTAINER (#DFE4EC)
       ===================================================================== */
    .workspace-band {
      max-width: 1480px;
      margin: 0 auto;
      padding: 20px 28px 36px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* TASK CARDS ROW (CLEAN PROBLEM SELECTOR) */
    .tasks-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 12px;
    }

    .task-pill-card {
      background: var(--shk-card-bg);
      border: 2px solid transparent;
      border-radius: 16px;
      padding: 13px 16px;
      cursor: pointer;
      text-align: left;
      transition: all 0.18s ease;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .task-pill-card:hover {
      border-color: #90C8FF;
      transform: translateY(-1px);
    }

    .task-pill-card.active {
      border-color: var(--shk-blue);
      box-shadow: 0 6px 18px rgba(0, 133, 255, 0.14);
    }

    .task-pill-num {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--shk-blue);
    }

    .task-pill-title {
      font-size: 14px;
      font-weight: 800;
      color: var(--shk-text);
      line-height: 1.3;
    }

    .task-pill-sub {
      font-size: 12px;
      color: var(--shk-text-sec);
    }

    /* =====================================================================
       3. TWO WHITE ISLANDS: STEP-BY-STEP LESSON (LEFT) + VISUAL STAGE (RIGHT)
       ===================================================================== */
    .lesson-grid {
      display: grid;
      grid-template-columns: 420px 1fr;
      gap: 20px;
      align-items: stretch;
    }

    @media (max-width: 1100px) {
      .lesson-grid {
        grid-template-columns: 1fr;
      }
    }

    .white-island {
      background: var(--shk-card-bg);
      border-radius: var(--radius-card);
      padding: 24px;
      box-shadow: 0 4px 20px rgba(15, 23, 42, 0.04);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* PROBLEM STATEMENT BOX */
    .problem-box {
      background: var(--shk-subtle-bg);
      border-radius: 14px;
      padding: 14px 16px;
      border-left: 4px solid var(--shk-navy);
    }

    .problem-box-tag {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--shk-text-muted);
      margin-bottom: 4px;
    }

    .problem-box-text {
      font-size: 13.5px;
      color: var(--shk-text);
      line-height: 1.55;
    }

    /* STEP PROGRESS TRACKER (ШАГ 1 -> ШАГ 5) */
    .steps-stepper {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .step-dot-btn {
      flex: 1;
      height: 36px;
      border-radius: 10px;
      border: 1.5px solid var(--shk-border);
      background: var(--shk-card-bg);
      color: var(--shk-text-sec);
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.16s ease;
    }

    .step-dot-btn:hover {
      border-color: var(--shk-blue);
      color: var(--shk-blue);
    }

    .step-dot-btn.done {
      background: var(--shk-blue-light);
      border-color: #90C8FF;
      color: var(--shk-blue);
    }

    .step-dot-btn.active {
      background: var(--shk-blue);
      border-color: var(--shk-blue);
      color: #FFFFFF;
      box-shadow: 0 3px 10px rgba(0, 133, 255, 0.28);
    }

    /* CURRENT STEP EXPLANATION CARD */
    .step-lesson-card {
      background: var(--shk-blue-light);
      border: 1.5px solid rgba(0, 133, 255, 0.25);
      border-radius: 16px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }

    .step-badge-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .step-badge {
      background: var(--shk-blue);
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .step-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--shk-text);
      line-height: 1.3;
    }

    .step-bullets {
      font-size: 13.5px;
      color: var(--shk-text);
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .step-takeaway {
      margin-top: auto;
      background: var(--shk-card-bg);
      border-radius: 12px;
      padding: 11px 14px;
      font-size: 13px;
      font-weight: 600;
      color: var(--shk-text);
      border-left: 3.5px solid var(--shk-green);
    }

    /* INTERACTIVE SLIDER / CONTROLS WHEN APPLICABLE */
    .step-controls-box {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .slider-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 700;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--shk-blue);
      cursor: pointer;
    }

    /* BOTTOM NAVIGATION BUTTONS (НАЗАД / СЛЕДУЮЩИЙ ШАГ) */
    .step-nav-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-step-prev {
      background: var(--shk-subtle-bg);
      color: var(--shk-text);
      border: 1px solid var(--shk-border);
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 700;
      padding: 12px 16px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-step-prev:hover:not(:disabled) {
      border-color: var(--shk-blue);
      color: var(--shk-blue);
    }

    .btn-step-prev:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-step-next {
      flex: 1;
      background: var(--shk-blue);
      color: #FFFFFF;
      border: none;
      font-family: inherit;
      font-size: 14px;
      font-weight: 800;
      padding: 12px 18px;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0, 133, 255, 0.3);
      transition: all 0.18s ease;
    }

    .btn-step-next:hover {
      background: var(--shk-blue-hover);
      transform: translateY(-1px);
    }

    /* RIGHT ISLAND: STAGE HEADER & CANVAS */
    .stage-top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--shk-border);
    }

    .stage-title-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .stage-pill {
      background: var(--shk-navy);
      color: #FFFFFF;
      font-size: 11.5px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 7px;
    }

    .stage-heading {
      font-size: 15px;
      font-weight: 800;
      color: var(--shk-text);
    }

    .btn-replay {
      background: var(--shk-subtle-bg);
      color: var(--shk-blue);
      border: 1px solid #90C8FF;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 700;
      padding: 7px 13px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-replay:hover {
      background: var(--shk-blue);
      color: #FFFFFF;
    }

    .canvas-box {
      position: relative;
      width: 100%;
      height: 540px;
      border-radius: 18px;
      background: #F8FAFC;
      border: 1px solid var(--shk-border);
      overflow: hidden;
      user-select: none;
    }

    body.dark-mode .canvas-box {
      background: #0F172A;
    }

    canvas#lessonCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .stage-caption-bar {
      background: var(--shk-subtle-bg);
      border-radius: 12px;
      padding: 11px 16px;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--shk-text);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
  </style>
</head>
<body>

  <!-- 1. SHKOLKOVO HEADER WITH ALL 5 SECTIONS -->
  <header class="shk-header">
    <div class="shk-header-inner">
      <a href="#" class="shk-logo" onclick="selectSection('graphs'); return false;">
        <svg width="34" height="34" viewBox="0 0 40 40" fill="none">
          <line x1="6" y1="12" x2="2" y2="9" stroke="#1890FF" stroke-width="2.4" stroke-linecap="round"/>
          <line x1="11" y1="6" x2="9" y2="2" stroke="#1890FF" stroke-width="2.4" stroke-linecap="round"/>
          <line x1="17" y1="7" x2="19" y2="3" stroke="#1890FF" stroke-width="2.4" stroke-linecap="round"/>
          <g transform="rotate(-32 21 22)">
            <rect x="11" y="9" width="20" height="26" rx="3.5" fill="#1890FF"/>
            <circle cx="21" cy="16" r="2.6" fill="#FFFFFF"/>
            <rect x="14" y="23" width="14" height="8" rx="1.5" fill="#69B7FF" fill-opacity="0.55"/>
          </g>
        </svg>
        <span class="shk-logo-word">ШКОЛКОВО</span>
      </a>

      <nav class="section-nav" id="sectionNav"></nav>

      <div class="header-right">
        <button class="shk-theme-pill" id="btnThemeSwitch" title="Дневная / ночная тема">
          <span class="shk-theme-opt active" id="themeSun">☀️</span>
          <span class="shk-theme-opt" id="themeMoon">🌙</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 2. MAIN WORKSPACE -->
  <main class="workspace-band">
    <!-- TASK SELECTOR ROW -->
    <section class="tasks-row" id="tasksRow"></section>

    <!-- TWO WHITE ISLANDS: STEP-BY-STEP WALKTHROUGH + VISUAL STAGE -->
    <section class="lesson-grid">
      <!-- LEFT WHITE ISLAND: STEP-BY-STEP GUIDED SOLUTION -->
      <aside class="white-island">
        <div class="problem-box">
          <div class="problem-box-tag" id="probTag">Условие олимпиадной задачи</div>
          <div class="problem-box-text" id="probStatement"></div>
        </div>

        <!-- 5-Step Progress Buttons -->
        <div class="steps-stepper" id="stepsStepper"></div>

        <!-- Active Step Lesson Card -->
        <div class="step-lesson-card">
          <div class="step-badge-row">
            <span class="step-badge" id="stepBadge">ШАГ 1 ИЗ 5</span>
          </div>
          <h2 class="step-title" id="stepTitle"></h2>
          <div class="step-bullets" id="stepBullets"></div>
          <div class="step-controls-box" id="stepControls"></div>
          <div class="step-takeaway" id="stepTakeaway"></div>
        </div>

        <!-- Step Navigation Buttons -->
        <div class="step-nav-row">
          <button class="btn-step-prev" id="btnPrevStep">← Назад</button>
          <button class="btn-step-next" id="btnNextStep">Следующий шаг решения →</button>
        </div>
      </aside>

      <!-- RIGHT WHITE ISLAND: INTERACTIVE VISUAL STAGE -->
      <section class="white-island">
        <div class="stage-top-bar">
          <div class="stage-title-group">
            <span class="stage-pill" id="stageStepPill">Наглядная демонстрация · Шаг 1</span>
            <h3 class="stage-heading" id="stageHeading">Что происходит на чертеже</h3>
          </div>
          <button class="btn-replay" id="btnReplayStep" onclick="replayStepAnimation()">
            ▶ Повторить анимацию шага
          </button>
        </div>

        <div class="canvas-box" id="canvasBox">
          <canvas id="lessonCanvas"></canvas>
        </div>

        <div class="stage-caption-bar">
          <span id="stageCaption">Нажми «Следующий шаг решения →», чтобы увидеть продолжение построения</span>
        </div>
      </section>
    </section>
  </main>
  <script>
    // =========================================================================
    // 1. ALL 5 SECTIONS WITH STEP-BY-STEP VISUAL TUTORIALS
    // =========================================================================
    const SECTIONS = {
      graphs: {
        id: "graphs",
        title: "🕸️ Теория графов",
        tasks: [
          {
            id: "g_knights",
            num: "Задача 1 · Перестановка коней",
            title: "Рокировка четырёх коней на доске 3 × 3",
            sub: "Как превратить шахматную доску в граф и развернуть звезду в круг",
            statement: "В углах шахматной доски $3 \\times 3$ стоят два белых коня (в нижних углах $a1, c1$) и два чёрных коня (в верхних углах $a3, c3$). Можно ли за несколько ходов поменять белых и чёрных коней местами так, чтобы ни в какой момент два коня не стояли на одной клетке?",
            steps: [
              {
                title: "Постановка задачи на шахматной доске 3 × 3",
                bullets: [
                  "• На доске $3 \\times 3$ стоят 4 коня: два белых внизу ($a1, c1$) и два чёрных вверху ($a3, c3$).",
                  "• Конь ходит буквой «Г». Если пытаться двигать коней вслепую на доске, легко запутаться.",
                  "• Заменим клетки доски на <b>вершины графа</b>, а возможные ходы коня — на <b>рёбра</b>!"
                ],
                takeaway: "Идея: переведём геометрию шахматной доски в граф переходов.",
                caption: "Шаг 1: Начальная расстановка — белые кони внизу (a1, c1), чёрные вверху (a3, c3)."
              },
              {
                title: "Строим граф ходов коня поверх доски",
                bullets: [
                  "• Соединим линиями каждые две клетки, между которыми конь может прыгнуть за 1 ход.",
                  "• Из центральной клетки $b2$ конь вообще не может сходить никуда в пределах доски $3 \\times 3$ — она изолирована!",
                  "• Остальные 8 крайних клеток соединяются в восьмиконечную звезду."
                ],
                takeaway: "Вывод шага: центральная клетка бесполезна, вся игра идёт на 8 крайних клетках.",
                caption: "Шаг 2: Проводим рёбра всех возможных ходов коня между клетками доски."
              },
              {
                title: "Главный трюк: распутываем звезду в простой круг!",
                bullets: [
                  "• На звезду неудобно смотреть, потому что рёбра пересекаются. Но граф — это не чертёж, его вершины можно перетащить!",
                  "• Смотри на экран: клетки $a1 \\to b3 \\to c1 \\to a2 \\to c3 \\to b1 \\to a3 \\to c2 \\to a1$ выстраиваются в <b>один замкнутый круг (цикл из 8 клеток)</b>!"
                ],
                takeaway: "Вывод шага: граф ходов коня на доске 3 × 3 — это обычный хоровод по кругу из 8 клеток!",
                caption: "Шаг 3: Анимация распутывания — звезда ходов коня разворачивается в один простой круг!"
              },
              {
                title: "Почему кони не могут перепрыгнуть друг через друга?",
                bullets: [
                  "• Посмотри, в каком порядке стоят кони на нашем круге сейчас: <b>Белый ($a1$) — Белый ($c1$) — Чёрный ($c3$) — Чёрный ($a3$)</b>.",
                  "• Поскольку кони ходят только по соседним вершинам круга и не могут вставать на одну клетку, ни один конь <b>не может обогнать соседа</b>!"
                ],
                takeaway: "Инвариант: порядок следования коней по кругу (Б — Б — Ч — Ч) никогда не меняется.",
                caption: "Шаг 4: На круге два белых коня идут подряд и два чёрных подряд — обогнать соседа нельзя."
              },
              {
                title: "Проверяем требуемую конечную позицию — Противоречие!",

    const canvas = document.getElementById("lessonCanvas");
    const ctx = canvas.getContext("2d");
    let W = 860, H = 540;

    function resizeCanvas() {
      const box = document.getElementById("canvasBox");
      if (!box) return;
      const rect = box.getBoundingClientRect();
      if (rect.width < 10) return;
      W = rect.width;
      H = rect.height;
      const dpr = window.devicePixelRatio || 1;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener("resize", () => {
      resizeCanvas();
      initCurrentStepScene();
    });

    function clearStepFX() {
      state.timers.forEach(t => clearTimeout(t));
      state.timers = [];
      state.particles = [];
      state.rings = [];
      state.morph = null;
      state.stepStartTime = performance.now();
    }

    function later(ms, fn) {
      const id = setTimeout(fn, ms);
      state.timers.push(id);
    }

    function easeInOut(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    function addRing(x, y, color = "#0085FF", maxR = 56) {
      state.rings.push({ x, y, r: 16, maxR, alpha: 0.9, color });
    }

    function addParticle(x0, y0, x1, y1, color = "#0085FF", duration = 500, onDone = null) {
      state.particles.push({
        x0, y0, x1, y1,
        t: 0,
        step: 16 / Math.max(120, duration),
        color,
        onDone
      });
    }

    function animateValue(from, to, durationMs, onUpdate, onDone) {
      const t0 = performance.now();
      function tick(now) {
        const p = Math.min(1, (now - t0) / durationMs);
        onUpdate(from + (to - from) * easeInOut(p));
        if (p < 1) requestAnimationFrame(tick);
        else if (onDone) onDone();
      }
      requestAnimationFrame(tick);
    }

    function initCurrentStepScene() {
      clearStepFX();
      resizeCanvas();
      const cx = W / 2, cy = H / 2;
      const s = state.stepIdx;

      // -----------------------------------------------------------------------
      if (state.taskId === "g_knights") {
        // The 8 outer cells in cycle order: a1 -> b3 -> c1 -> a2 -> c3 -> b1 -> a3 -> c2
        const cycleCells = [
          { code: "a1", r: 2, c: 0, initKnight: "W" },
          { code: "b3", r: 0, c: 1, initKnight: null },
          { code: "c1", r: 2, c: 2, initKnight: "W" },
          { code: "a2", r: 1, c: 0, initKnight: null },
          { code: "c3", r: 0, c: 2, initKnight: "B" },
          { code: "b1", r: 2, c: 1, initKnight: null },
          { code: "a3", r: 0, c: 0, initKnight: "B" },
          { code: "c2", r: 1, c: 2, initKnight: null }
        ];
        state.knightsShift = 0;

        const boardPos = cell => ({
          x: cx - 150 + (cell.c - 1) * 115,
          y: cy + (cell.r - 1) * 115
        });
        const circlePos = idx => {
          const ang = (idx * 2 * Math.PI) / 8 + Math.PI / 2;
          const centerX = s >= 2 ? cx + 120 : cx;
          return {
            x: centerX + 165 * Math.cos(ang),
            y: cy + 165 * Math.sin(ang)
          };
        };

        state.nodes = cycleCells.map((cell, idx) => {
          const p = (s <= 1) ? boardPos(cell) : (s === 2 ? boardPos(cell) : circlePos(idx));
          return {
            id: idx,
            code: cell.code,
            r: cell.r,
            c: cell.c,
            x: p.x,
            y: p.y,
            knight: cell.initKnight
          };
        });

        if (s === 1) {
          // Animate knight edges shooting around the star
          state.nodes.forEach((n, i) => {
            const next = state.nodes[(i + 1) % 8];
            later(i * 180, () => addParticle(n.x, n.y, next.x, next.y, "#0085FF", 420));
          });
        } else if (s === 2) {
          // Morph from 3x3 board star to clean octagon on the right!
          const startMap = {};
          const targetMap = {};
          state.nodes.forEach((n, idx) => {
            startMap[n.id] = { x: n.x, y: n.y };
            targetMap[n.id] = circlePos(idx);
          });
          later(250, () => {
            state.morph = { startMap, targetMap, startTime: performance.now(), duration: 1200 };
          });
        } else if (s === 4) {
          // Step 5: demo shift along the circle
          later(350, () => shiftKnightsOnCircle(1));
        }
      }

      // -----------------------------------------------------------------------
      // GRAPH TASK 2: THREE HOUSES AND THREE WELLS (g_k33)
      // -----------------------------------------------------------------------
      else if (state.taskId === "g_k33") {
        // Hexagon order: Д1 (0) - К1 (1) - Д2 (2) - К2 (3) - Д3 (4) - К3 (5)
        const labels = ["Дом 1", "Колодец 1", "Дом 2", "Колодец 2", "Дом 3", "Колодец 3"];
        const types  = ["house", "well", "house", "well", "house", "well"];
        state.nodes = labels.map((lb, i) => {
          const ang = (i * 2 * Math.PI) / 6 - Math.PI / 2;
          return {
            id: i,
            label: lb,
            type: types[i],
            x: cx + 170 * Math.cos(ang),
            y: cy + 170 * Math.sin(ang)
          };
        });
        if (s === 0) {
          for (let i = 0; i < 6; i++) {
            const a = state.nodes[i], b = state.nodes[(i + 1) % 6];
            later(i * 220, () => {
              addParticle(a.x, a.y, b.x, b.y, "#0085FF", 380);
              addRing(b.x, b.y, "#0085FF", 44);
            });
          }
        } else if (s === 2) {
          // Shoot 7th edge inside (0 -> 3)
          const n0 = state.nodes[0], n3 = state.nodes[3];
          later(200, () => addParticle(n0.x, n0.y, n3.x, n3.y, "#0085FF", 500));
        } else if (s === 3) {
          // 9th edge (4 -> 1) hits the barrier at center
          const n4 = state.nodes[4], n1 = state.nodes[1];
          later(250, () => {
            addParticle(n4.x, n4.y, cx, cy, "#F04438", 550, () => {
              addRing(cx, cy, "#F04438", 75);
            });
          });
        }
      }

      // -----------------------------------------------------------------------
      // GRAPH TASK 3: TREES, EXTREMAL PATH & LEAF PRUNING (g_tree)
      // -----------------------------------------------------------------------
      else if (state.taskId === "g_tree") {
        if (s === 0) {
          // Two disconnected triangles counterexample
          state.nodes = [];
          state.edges = [];
          for (let i = 0; i < 3; i++) {
            const a = (i * 2 * Math.PI) / 3 - Math.PI / 2;
            state.nodes.push({ id: i + 1, label: "Г" + (i + 1), x: cx - 175 + 95 * Math.cos(a), y: cy + 95 * Math.sin(a), alive: true });
            state.nodes.push({ id: i + 4, label: "Г" + (i + 4), x: cx + 175 + 95 * Math.cos(a), y: cy + 95 * Math.sin(a), alive: true });
          }
          [[1,2],[2,3],[3,1],[4,5],[5,6],[6,4]].forEach(([u,v]) => state.edges.push({ u, v, alive: true }));
        } else {
          buildSampleTree(cx, cy);
          if (s === 1) {
            // Animate walker along path 1 -> 2 -> 4 -> 7
            const path = [1, 2, 4, 7];
            path.forEach((id, idx) => {
              later(idx * 480, () => {
                const u = state.nodes.find(n => n.id === id);
                if (u) {
                  u.highlight = idx === path.length - 1 ? "green" : "blue";
                  addRing(u.x, u.y, idx === path.length - 1 ? "#10B981" : "#0085FF", 52);
                }
                if (idx + 1 < path.length) {
                  const v = state.nodes.find(n => n.id === path[idx + 1]);
                  if (u && v) addParticle(u.x, u.y, v.x, v.y, "#10B981", 430);
                }
              });
            });
          } else if (s === 2) {
            // Cut leaf 7!
            const leaf = state.nodes.find(n => n.id === 7);
            const par = state.nodes.find(n => n.id === 4);
            if (leaf) leaf.highlight = "amber";
            later(450, () => {
              if (leaf && par) {
                addRing(leaf.x, leaf.y, "#F04438", 65);
                addParticle(leaf.x, leaf.y, par.x, par.y, "#F04438", 450, () => {
                  leaf.alive = false;
                  state.edges.forEach(e => { if (e.u === 7 || e.v === 7) e.alive = false; });
                });
              }
            });
          } else if (s === 3) {
            // Cascade pruning of all leaves down to root 1!
            const pruneOrder = [
              { leaf: 7, par: 4 },
              { leaf: 8, par: 4 },
              { leaf: 5, par: 2 },
              { leaf: 6, par: 3 },
              { leaf: 4, par: 2 },
              { leaf: 2, par: 1 },
              { leaf: 3, par: 1 }
            ];
            pruneOrder.forEach((item, idx) => {
              later(idx * 560 + 200, () => {
                const lf = state.nodes.find(n => n.id === item.leaf);
                const pr = state.nodes.find(n => n.id === item.par);
                if (lf && pr) {
                  lf.highlight = "amber";
                  addRing(lf.x, lf.y, "#F59E0B", 52);
                  addParticle(lf.x, lf.y, pr.x, pr.y, "#F59E0B", 380, () => {
                    lf.alive = false;
                    state.edges.forEach(e => { if (e.u === item.leaf || e.v === item.leaf) e.alive = false; });
                  });
                }
              });
            });
          }
        }
      }

      // -----------------------------------------------------------------------
      // GRAPH TASK 4: TOURNAMENT KING (g_king)
      // -----------------------------------------------------------------------
      else if (state.taskId === "g_king") {
        state.nodes = [];
        state.edges = [];
        for (let i = 0; i < 6; i++) {
          const a = (i * 2 * Math.PI) / 6 - Math.PI / 2;
          state.nodes.push({
            id: i + 1,
            label: "Ком. " + (i + 1),
            x: cx + 175 * Math.cos(a),
            y: cy + 175 * Math.sin(a),
            alive: true
          });
        }
        const pairs = [
          [1,2],[1,3],[1,4],[1,5],[6,1],
          [2,3],[2,4],[2,6],[5,2],
          [3,4],[3,5],[3,6],
          [4,5],[4,6],
          [5,6]
        ];
        pairs.forEach(([u,v]) => state.edges.push({ u, v, alive: true }));
        state.kingTargetId = 1;

        if (s === 2) {
          // Shoot 1-step blue beams from Team 1 to 2,3,4,5
          const n1 = state.nodes[0];
          [2, 3, 4, 5].forEach(tid => {
            const target = state.nodes[tid - 1];
            later(200, () => addParticle(n1.x, n1.y, target.x, target.y, "#0085FF", 520, () => addRing(target.x, target.y, "#0085FF", 48)));
          });
        } else if (s === 3 || s === 4) {
          triggerKingRadarParticles(state.kingTargetId);
        }
      }

      // -----------------------------------------------------------------------
      // ALGEBRA TASKS (a_mod, a_pencil, a_circle)
      // -----------------------------------------------------------------------
      else if (state.taskId === "a_mod") {
        if (s === 3) {
          animateValue(0.2, 3.0, 950, val => { state.algA = val; });
        } else if (s === 4) {
          state.algA = 3.0;
        }
      } else if (state.taskId === "a_pencil") {
        if (s === 2) state.algA = -0.6;
        else if (s === 3) animateValue(-0.6, 0.35, 950, val => { state.algA = val; });
        else if (s === 4) state.algA = 0.2;
      } else if (state.taskId === "a_circle") {
        if (s === 1) state.algA = 1.5;
        else if (s === 2) animateValue(1.2, 3.0, 850, val => { state.algA = val; });
        else if (s === 3) animateValue(3.0, 3 * Math.SQRT2, 850, val => { state.algA = val; });
        else if (s === 4) state.algA = 3.0;
      }

      // -----------------------------------------------------------------------
      // LOGIC TASKS (l_ring, l_inv, l_game)
      // -----------------------------------------------------------------------
      else if (state.taskId === "l_ring") {
        state.ringVals = [10, -1, -1, -1, 10, -1, -1, -1, 10, -1, -1, -1, 10];
        if (s === 3) {
          for (let i = 0; i < 13; i++) {
            later(i * 180, () => { state.ringScanIdx = i; });
          }
        }
      } else if (state.taskId === "l_inv") {
        state.invNums = [100, 200, 2025];
      } else if (state.taskId === "l_game") {
        state.gamePos = 1;
        state.gameMsg = "Сделай ход +1, +2 или +3 и посмотри ответ Второго игрока!";
      }

      // -----------------------------------------------------------------------
      // COMBINATORICS TASKS (c_stars, c_pairs)
      // -----------------------------------------------------------------------
      else if (state.taskId === "c_stars") {
        if (s <= 1) {
          state.comboEmpty = false;
          state.comboBoxes = [3, 2, 3, 2];
        } else {
          state.comboEmpty = true;
          state.comboBoxes = [4, 0, 4, 2];
        }
      } else if (state.taskId === "c_pairs") {
        state.pairGlueIn = s >= 1;
        state.pairGlueTab = s >= 2;
      }

      // -----------------------------------------------------------------------
      // PLANIMETRY TASKS (m_median, m_circle)
      // -----------------------------------------------------------------------
      else if (state.taskId === "m_median") {
        if (s === 0) state.geomRotT = 0;
        else if (s === 1) animateValue(0, 1, 1050, val => { state.geomRotT = val; });
        else state.geomRotT = 1;
      } else if (state.taskId === "m_circle") {
        const circ = getCircumcircle(state.cirA, state.cirB, state.cirD);
        if (circ) {
          const ang = -0.62;
          state.cirC = { x: circ.x + circ.r * Math.cos(ang), y: circ.y + circ.r * Math.sin(ang) };
        }
      }

      renderStepControls();
    }

    function buildSampleTree(cx, cy) {
      state.nodes = [
        { id: 1, label: "Корень 1", x: cx - 220, y: cy, alive: true },
        { id: 2, label: "Узел 2",   x: cx - 75,  y: cy - 85, alive: true },
        { id: 3, label: "Узел 3",   x: cx - 75,  y: cy + 95, alive: true },
        { id: 4, label: "Узел 4",   x: cx + 75,  y: cy - 35, alive: true },
        { id: 5, label: "Лист 5",   x: cx + 75,  y: cy - 155, alive: true },
        { id: 6, label: "Лист 6",   x: cx + 85,  y: cy + 135, alive: true },
        { id: 7, label: "Лист 7",   x: cx + 225, y: cy - 95, alive: true },
        { id: 8, label: "Лист 8",   x: cx + 225, y: cy + 35, alive: true }
      ];
      state.edges = [
        { u: 1, v: 2, alive: true },
        { u: 1, v: 3, alive: true },
        { u: 2, v: 5, alive: true },
        { u: 2, v: 4, alive: true },
        { u: 3, v: 6, alive: true },
        { u: 4, v: 7, alive: true },
        { u: 4, v: 8, alive: true }
      ];
    }

    function triggerKingRadarParticles(kingId) {
      state.kingTargetId = kingId;
      const kNode = state.nodes.find(n => n.id === kingId);
      if (!kNode) return;
      addRing(kNode.x, kNode.y, "#0085FF", 58);
      const step1 = new Set();
      state.edges.forEach(e => {
        if (e.u === kingId) {
          step1.add(e.v);
          const vn = state.nodes.find(n => n.id === e.v);
          if (vn) addParticle(kNode.x, kNode.y, vn.x, vn.y, "#0085FF", 450);
        }
      });
      later(500, () => {
        state.edges.forEach(e => {
          if (step1.has(e.u) && e.v !== kingId && !step1.has(e.v)) {
            const un = state.nodes.find(n => n.id === e.u);
            const vn = state.nodes.find(n => n.id === e.v);
            if (un && vn) addParticle(un.x, un.y, vn.x, vn.y, "#10B981", 450, () => addRing(vn.x, vn.y, "#10B981", 52));
          }
        });
      });
    }

    window.shiftKnightsOnCircle = function(delta) {
      state.knightsShift = (state.knightsShift + delta + 8) % 8;
      // Rotate knights along the 8-cycle without overtaking!
      const basePositions = [0, 2, 4, 6];
      const baseColors = ["W", "W", "B", "B"];
      state.nodes.forEach(n => { n.knight = null; });
      basePositions.forEach((pos, idx) => {
        const targetIdx = (pos + state.knightsShift) % 8;
        state.nodes[targetIdx].knight = baseColors[idx];
      });
    };
    // =========================================================================
    // 4. STEP-BY-STEP VISUAL STAGE RENDERERS (ALL 5 SECTIONS)
    // =========================================================================
    function renderCanvasFrame(now) {
      // Update morph if active
      if (state.morph) {
        const p = Math.min(1, (now - state.morph.startTime) / state.morph.duration);
        const k = easeInOut(p);
        state.nodes.forEach(n => {
          const a = state.morph.startMap[n.id];
          const b = state.morph.targetMap[n.id];
          if (a && b) {
            n.x = a.x + (b.x - a.x) * k;
            n.y = a.y + (b.y - a.y) * k;
          }
        });
        if (p >= 1) state.morph = null;
      }

      ctx.clearRect(0, 0, W, H);
      const isDark = document.body.classList.contains("dark-mode");

      // Subtle background dots
      ctx.save();
      ctx.fillStyle = isDark ? "rgba(148,163,184,0.12)" : "rgba(148,163,184,0.25)";
      for (let x = 28; x < W; x += 32) {
        for (let y = 28; y < H; y += 32) {
          ctx.fillRect(x, y, 1.5, 1.5);
        }
      }
      ctx.restore();

      const s = state.stepIdx;

      // -----------------------------------------------------------------------
      // RENDER: GRAPH TASK 1 — KNIGHTS ON 3x3 BOARD (g_knights)
      // -----------------------------------------------------------------------
      if (state.taskId === "g_knights") {
        const cx = W / 2, cy = H / 2;
        const boardX = s >= 2 ? cx - 230 : cx - 150;

        // Always draw the 3x3 Chessboard reference on the left (or center on Step 0-1)
        const cellSz = s >= 2 ? 76 : 115;
        ctx.save();
        ctx.font = "700 13px 'Inter', sans-serif";
        ctx.fillStyle = isDark ? "#CBD5E1" : "#475467";
        ctx.textAlign = "center";
        ctx.fillText("Шахматная доска 3 × 3", boardX, cy - 1.5 * cellSz - 18);

        for (let r = 0; r < 3; r++) {
          for (let c = 0; c < 3; c++) {
            const x = boardX + (c - 1.5) * cellSz;
            const y = cy + (r - 1.5) * cellSz;
            const isLight = (r + c) % 2 === 0;
            ctx.fillStyle = isLight ? (isDark ? "#334155" : "#F1F5F9") : (isDark ? "#1E293B" : "#CBD5E1");
            ctx.strokeStyle = "#94A3B8";
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.roundRect(x, y, cellSz, cellSz, 8);
            ctx.fill();
            ctx.stroke();

            const code = `${"abc"[c]}${3 - r}`;
            ctx.fillStyle = "#64748B";
            ctx.font = "700 11px 'JetBrains Mono', monospace";
            ctx.textAlign = "left";
            ctx.fillText(code, x + 7, y + 16);

            // Show center cell b2 isolated on Step >= 1
            if (r === 1 && c === 1 && s >= 1) {
              ctx.fillStyle = "#94A3B8";
              ctx.font = "600 11px 'Inter', sans-serif";
              ctx.textAlign = "center";
              ctx.fillText("нет ходов", x + cellSz / 2, y + cellSz / 2 + 4);
            }

            // On Step >= 2, also mirror the current knights onto the mini-board!
            if (s >= 2) {
              const matchNode = state.nodes.find(n => n.r === r && n.c === c);
              if (matchNode && matchNode.knight) {
                drawKnightToken(x + cellSz / 2, y + cellSz / 2 + 4, matchNode.knight, 19);
              }
            }
          }
        }
        ctx.restore();

        // Draw cycle edges when Step >= 1
        if (s >= 1) {
          for (let i = 0; i < 8; i++) {
            const a = state.nodes[i];
            const b = state.nodes[(i + 1) % 8];
            ctx.save();
            ctx.strokeStyle = s >= 2 ? "#0085FF" : "#64748B";
            ctx.lineWidth = s >= 2 ? 3.5 : 2.5;
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.stroke();
            ctx.restore();
          }
        }

        // Title above unfolded circle on Step >= 2
        if (s >= 2) {
          ctx.save();
          ctx.font = "800 14px 'Inter', sans-serif";
          ctx.fillStyle = "#0085FF";
          ctx.textAlign = "center";
          ctx.fillText("Тот же граф, развёрнутый в круг (8 клеток)", cx + 120, cy - 198);
          ctx.restore();
        }

        // Draw the 8 outer cell nodes
        state.nodes.forEach(n => {
          ctx.save();
          ctx.beginPath();
          ctx.arc(n.x, n.y, 25, 0, Math.PI * 2);
          ctx.fillStyle = isDark ? "#1E293B" : "#FFFFFF";
          ctx.fill();
          ctx.lineWidth = 2.8;
          ctx.strokeStyle = n.knight ? "#0085FF" : "#94A3B8";
          ctx.stroke();

          if (n.knight) {
            drawKnightToken(n.x, n.y, n.knight, 22);
          }

          ctx.fillStyle = isDark ? "#E2E8F0" : "#0F172A";
          ctx.font = "800 12px 'JetBrains Mono', monospace";
          ctx.textAlign = "center";
          ctx.fillText(n.code, n.x, n.y + 39);
          ctx.restore();
        });
      }

      // -----------------------------------------------------------------------
      // RENDER: GRAPH TASK 2 — THREE HOUSES & THREE WELLS (g_k33)
      // -----------------------------------------------------------------------
      else if (state.taskId === "g_k33") {
        const cx = W / 2, cy = H / 2;
        const pts = state.nodes;

        // Step >= 1: Shade Inside (Blue) and Outside (Green) of the hexagon
        if (s >= 1) {
          ctx.save();
          ctx.fillStyle = "rgba(0, 133, 255, 0.10)";
          ctx.beginPath();
          pts.forEach((p, idx) => idx === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = "#0085FF";
          ctx.font = "800 13px 'Inter', sans-serif";
          ctx.textAlign = "center";
          ctx.fillText("Внутренняя область контура", cx, cy - 65);
          ctx.fillStyle = "#10B981";
          ctx.fillText("Внешняя область вокруг шестиугольника", cx, 36);
          ctx.restore();
        }

        // Draw the 6 hexagon edges (1..6)
        for (let i = 0; i < 6; i++) {
          const a = pts[i], b = pts[(i + 1) % 6];
          ctx.save();
          ctx.strokeStyle = "#0F172A";
          if (isDark) ctx.strokeStyle = "#E2E8F0";
          ctx.lineWidth = 3.2;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
          ctx.restore();
        }

        // Step >= 2: Draw 7th path (Дом 1 -> Колодец 2, i.e. 0 -> 3) INSIDE, and 8th path (Дом 2 -> Колодец 3, i.e. 2 -> 5) OUTSIDE!
        if (s >= 2) {
          // 7th path inside
          ctx.save();
          ctx.strokeStyle = "#0085FF";
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.moveTo(pts[0].x, pts[0].y);
          ctx.lineTo(pts[3].x, pts[3].y);
          ctx.stroke();

          ctx.fillStyle = "#0085FF";
          ctx.font = "800 12px 'Inter', sans-serif";
          ctx.fillText("7-я тропинка (перегородила внутри!)", cx + 10, cy + 8);

          // 8th path curving outside from pts[2] (Дом 2) to pts[5] (Колодец 3)
          ctx.strokeStyle = "#10B981";
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.moveTo(pts[2].x, pts[2].y);
          ctx.bezierCurveTo(cx + 310, cy - 230, cx - 120, cy - 280, pts[5].x, pts[5].y);
          ctx.stroke();
          ctx.fillStyle = "#10B981";
          ctx.fillText("8-я тропинка (обогнула снаружи!)", cx + 125, cy - 195);
          ctx.restore();
        }

        // Step >= 3: Show 9th path (Дом 3 [4] -> Колодец 1 [1]) blocked by red X!
        if (s >= 3) {
          ctx.save();
          ctx.strokeStyle = "#F04438";
          ctx.lineWidth = 4;
          ctx.setLineDash([8, 6]);
          ctx.beginPath();
          ctx.moveTo(pts[4].x, pts[4].y);
          ctx.lineTo(pts[1].x, pts[1].y);
          ctx.stroke();
          ctx.setLineDash([]);

          // Red collision badge at center
          ctx.fillStyle = "#F04438";
          ctx.beginPath();
          ctx.arc(cx, cy, 16, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#FFFFFF";
          ctx.font = "900 14px 'Inter', sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText("✕", cx, cy);

          ctx.fillStyle = "#F04438";
          ctx.font = "800 13px 'Inter', sans-serif";
          ctx.fillText("9-я тропинка (Дом 3 — Колодец 1) заперта!", cx, H - 26);
          ctx.restore();
        }

        // Draw Nodes (Houses & Wells)
        pts.forEach(p => {
          const isHouse = p.type === "house";
          ctx.save();
          ctx.beginPath();
          ctx.arc(p.x, p.y, 26, 0, Math.PI * 2);
          ctx.fillStyle = isHouse ? "#0085FF" : "#10B981";
          ctx.fill();
          ctx.lineWidth = 3;
          ctx.strokeStyle = "#FFFFFF";
          ctx.stroke();

          ctx.fillStyle = "#FFFFFF";
          ctx.font = "700 16px 'Inter', sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(isHouse ? "🏠" : "💧", p.x, p.y);

          ctx.fillStyle = isDark ? "#F8FAFC" : "#0F172A";
          ctx.font = "700 12.5px 'Inter', sans-serif";
          ctx.fillText(p.label, p.x, p.y + 40);
          ctx.restore();
        });
      }

      // -----------------------------------------------------------------------
      // RENDER: GRAPH TASK 3 — TREES & INDUCTION (g_tree)
      // -----------------------------------------------------------------------
      else if (state.taskId === "g_tree") {
        const aliveNodes = state.nodes.filter(n => n.alive !== false);
        const aliveEdges = state.edges.filter(e => e.alive !== false);
        const byId = new Map(aliveNodes.map(n => [n.id, n]));

        // Compute current degrees
        const deg = new Map();
        aliveNodes.forEach(n => deg.set(n.id, 0));
        aliveEdges.forEach(e => {
          if (deg.has(e.u) && deg.has(e.v)) {
            deg.set(e.u, deg.get(e.u) + 1);
            deg.set(e.v, deg.get(e.v) + 1);
          }
        });

        // Top summary counter for V and E
        ctx.save();
        ctx.fillStyle = isDark ? "#F8FAFC" : "#0F172A";
        ctx.font = "800 15px 'Inter', sans-serif";
        ctx.textAlign = "center";
        if (s === 0) {
          ctx.fillText("Два несвязных треугольника: вершин 6, рёбер 6, у каждой вершины по 2 ребра", W / 2, 42);
        } else {
          ctx.fillText(`Текущее дерево: Вершин V = ${aliveNodes.length}   |   Рёбер E = ${aliveEdges.length}   |   Разность V − E = ${aliveNodes.length - aliveEdges.length}`, W / 2, 42);
        }
        ctx.restore();

        // Edges
        aliveEdges.forEach(e => {
          const a = byId.get(e.u), b = byId.get(e.v);
          if (!a || !b) return;
          ctx.save();
          ctx.strokeStyle = "#64748B";
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
          ctx.restore();
        });

        // Nodes
        aliveNodes.forEach(n => {
          const d = deg.get(n.id) || 0;
          const isLeaf = s >= 1 && d === 1;
          ctx.save();
          ctx.beginPath();
          ctx.arc(n.x, n.y, 24, 0, Math.PI * 2);
          if (n.highlight === "amber") ctx.fillStyle = "#F59E0B";
          else if (n.highlight === "green" || isLeaf) ctx.fillStyle = "#10B981";
          else ctx.fillStyle = "#0085FF";
          ctx.fill();
          ctx.lineWidth = 3;
          ctx.strokeStyle = "#FFFFFF";
          ctx.stroke();

          ctx.fillStyle = "#FFFFFF";
          ctx.font = "800 12px 'Inter', sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(String(n.id), n.x, n.y);

          ctx.fillStyle = isDark ? "#E2E8F0" : "#0F172A";
          ctx.font = "700 12px 'Inter', sans-serif";
          ctx.fillText(isLeaf ? "Лист (1 ребро)" : n.label, n.x, n.y + 38);
          ctx.restore();
        });
      }

      // -----------------------------------------------------------------------
      // RENDER: GRAPH TASK 4 — TOURNAMENT KING (g_king)
      // -----------------------------------------------------------------------
      else if (state.taskId === "g_king") {
        const byId = new Map(state.nodes.map(n => [n.id, n]));
        const outDeg = new Map();
        state.nodes.forEach(n => outDeg.set(n.id, 0));
        state.edges.forEach(e => outDeg.set(e.u, (outDeg.get(e.u) || 0) + 1));

        const kingId = state.kingTargetId || 1;
        const step1 = new Set();
        state.edges.forEach(e => { if (e.u === kingId) step1.add(e.v); });
        const step2 = new Set();
        state.edges.forEach(e => {
          if (step1.has(e.u) && e.v !== kingId && !step1.has(e.v)) step2.add(e.v);
        });

        // Draw Directed Edges
        state.edges.forEach(e => {
          const a = byId.get(e.u), b = byId.get(e.v);
          if (!a || !b) return;
          let col = isDark ? "rgba(148,163,184,0.35)" : "rgba(148,163,184,0.55)";
          let lw = 2;
          if (s >= 2 && e.u === kingId) {
            col = "#0085FF"; lw = 3.6;
          } else if (s >= 3 && step1.has(e.u) && step2.has(e.v)) {
            col = "#10B981"; lw = 3.8;
          }
          ctx.save();
          ctx.strokeStyle = col;
          ctx.lineWidth = lw;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();

          // Arrowhead
          const ang = Math.atan2(b.y - a.y, b.x - a.x);
          const ax = b.x - 27 * Math.cos(ang), ay = b.y - 27 * Math.sin(ang);
          ctx.fillStyle = col;
          ctx.beginPath();
          ctx.moveTo(ax, ay);
          ctx.lineTo(ax - 10 * Math.cos(ang - 0.38), ay - 10 * Math.sin(ang - 0.38));
          ctx.lineTo(ax - 10 * Math.cos(ang + 0.38), ay - 10 * Math.sin(ang + 0.38));
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        });

        // Draw Team Nodes
        state.nodes.forEach(n => {
          const wins = outDeg.get(n.id) || 0;
          let fill = isDark ? "#1E293B" : "#FFFFFF";
          let stroke = "#64748B";
          let txt = isDark ? "#F8FAFC" : "#0F172A";
          let sub = `${wins} побед`;

          if (s >= 1 && n.id === kingId) {
            fill = "#0085FF"; stroke = "#005BB5"; txt = "#FFFFFF";
            sub = `👑 Лидер (${wins} побед)`;
          } else if (s >= 2 && step1.has(n.id)) {
            fill = "#EBF5FF"; stroke = "#0085FF"; txt = "#005BB5";
            sub = `Побеждён за 1 шаг (${wins} поб.)`;
          } else if (s >= 3 && step2.has(n.id)) {
            fill = "#ECFDF5"; stroke = "#10B981"; txt = "#065F46";
            sub = `Побеждён за 2 шага (${wins} поб.)`;
          } else if (s >= 3) {
            fill = "#FEF3F2"; stroke = "#F04438"; txt = "#991B1B";
            sub = "Не достигнут!";
          }

          ctx.save();
          ctx.beginPath();
          ctx.arc(n.x, n.y, 25, 0, Math.PI * 2);
          ctx.fillStyle = fill;
          ctx.fill();
          ctx.lineWidth = 3;
          ctx.strokeStyle = stroke;
          ctx.stroke();

          ctx.fillStyle = txt;
          ctx.font = "800 12.5px 'Inter', sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(n.label, n.x, n.y);

          ctx.fillStyle = isDark ? "#E2E8F0" : "#1E293B";
          ctx.font = "700 11.5px 'Inter', sans-serif";
          ctx.fillText(sub, n.x, n.y + 39);
          ctx.restore();
        });
      }

      // -----------------------------------------------------------------------
      // RENDER: ALGEBRA TASKS (a_mod, a_pencil, a_circle)
      // -----------------------------------------------------------------------
      else if (state.secId === "algebra") {
        renderAlgebraScene();
      }

      // -----------------------------------------------------------------------
      // RENDER: LOGIC TASKS (l_ring, l_inv, l_game)
      // -----------------------------------------------------------------------
      else if (state.secId === "logic") {
        renderLogicScene();
      }

      // -----------------------------------------------------------------------
      // RENDER: COMBINATORICS TASKS (c_stars, c_pairs)
      // -----------------------------------------------------------------------
      else if (state.secId === "combo") {
        renderComboScene();
      }

      // -----------------------------------------------------------------------
      // RENDER: PLANIMETRY TASKS (m_median, m_circle)
      // -----------------------------------------------------------------------
      else if (state.secId === "geom") {
        renderGeomScene();
      }

      // Render active particles & sonar rings on top of any scene
      for (let i = state.particles.length - 1; i >= 0; i--) {
        const p = state.particles[i];
        p.t += p.step;
        const k = Math.min(1, p.t);
        const x = p.x0 + (p.x1 - p.x0) * k;
        const y = p.y0 + (p.y1 - p.y0) * k;
        ctx.save();
        ctx.beginPath();
        ctx.arc(x, y, 12, 0, Math.PI * 2);
        ctx.fillStyle = p.color + "33";
        ctx.fill();
        ctx.beginPath();
        ctx.arc(x, y, 6, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
        ctx.restore();
        if (p.t >= 1) {
          if (p.onDone) p.onDone();
          state.particles.splice(i, 1);
        }
      }

      for (let i = state.rings.length - 1; i >= 0; i--) {
        const r = state.rings[i];
        r.r += 1.4;
        r.alpha *= 0.93;
        ctx.save();
        ctx.beginPath();
        ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
        ctx.strokeStyle = r.color;
        ctx.globalAlpha = r.alpha;
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.restore();
        if (r.r >= r.maxR || r.alpha < 0.04) state.rings.splice(i, 1);
      }

      requestAnimationFrame(renderCanvasFrame);
    }

    function drawKnightToken(x, y, colorType, rad = 20) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(x, y, rad, 0, Math.PI * 2);
      ctx.fillStyle = colorType === "W" ? "#FFFFFF" : "#0F172A";
      ctx.fill();
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = colorType === "W" ? "#0085FF" : "#F59E0B";
      ctx.stroke();
      ctx.fillStyle = colorType === "W" ? "#0F172A" : "#FFFFFF";
      ctx.font = `${Math.round(rad * 0.95)}px sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("♞", x, y + 1);
      ctx.restore();
    }
    // =========================================================================
    // 5. ALGEBRA, LOGIC, COMBO & GEOMETRY STEP-BY-STEP SCENE RENDERERS
    // =========================================================================
    function renderAlgebraScene() {
      const s = state.stepIdx;
      const cx = W * 0.5, cy = H * 0.62;
      const scale = 42;
      const toX = x => cx + x * scale;
      const toY = y => cy - y * scale;
      const isDark = document.body.classList.contains("dark-mode");

      // Coordinate Axes
      ctx.save();
      ctx.strokeStyle = isDark ? "#334155" : "#CBD5E1";
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(0, cy); ctx.lineTo(W, cy);
      ctx.moveTo(cx, 0); ctx.lineTo(cx, H);
      ctx.stroke();

      ctx.fillStyle = "#64748B";
      ctx.font = "600 11px 'JetBrains Mono', monospace";
      for (let gx = -8; gx <= 8; gx += 2) {
        if (gx !== 0) ctx.fillText(String(gx), toX(gx) - 5, cy + 16);
      }
      for (let gy = -4; gy <= 8; gy += 2) {
        if (gy !== 0) ctx.fillText(String(gy), cx + 8, toY(gy) + 4);
      }
      ctx.restore();

      if (state.taskId === "a_mod") {
        // Step 0: y = |x - 1|
        // Step 1: y = |x - 1| - 3
        // Step 2..4: y = ||x - 1| - 3| (with ghost of underwater part on Step 2)
        ctx.save();
        if (s === 0) {
          ctx.strokeStyle = "#0085FF";
          ctx.lineWidth = 3.5;
          ctx.beginPath();
          ctx.moveTo(toX(-8), toY(9));
          ctx.lineTo(toX(1), toY(0));
          ctx.lineTo(toX(10), toY(9));
          ctx.stroke();
          drawCoordPoint(toX(1), toY(0), "Вершина (1; 0)", "#0085FF");
        } else if (s === 1) {
          ctx.strokeStyle = "#0085FF";
          ctx.lineWidth = 3.5;
          ctx.beginPath();
          ctx.moveTo(toX(-8), toY(6));
          ctx.lineTo(toX(1), toY(-3));
          ctx.lineTo(toX(10), toY(6));
          ctx.stroke();
          drawCoordPoint(toX(1), toY(-3), "Вершина (1; −3)", "#F59E0B");
          drawCoordPoint(toX(-2), toY(0), "(−2; 0)", "#0085FF");
          drawCoordPoint(toX(4), toY(0), "(4; 0)", "#0085FF");
        } else {
          // Dashed underwater part
          ctx.strokeStyle = "rgba(148, 163, 184, 0.55)";
          ctx.lineWidth = 2;
          ctx.setLineDash([6, 4]);
          ctx.beginPath();
          ctx.moveTo(toX(-2), toY(0));
          ctx.lineTo(toX(1), toY(-3));
          ctx.lineTo(toX(4), toY(0));
          ctx.stroke();
          ctx.setLineDash([]);

          // Reflected W-graph
          ctx.strokeStyle = isDark ? "#F8FAFC" : "#0F172A";
          ctx.lineWidth = 3.5;
          ctx.beginPath();
          ctx.moveTo(toX(-9), toY(7));
          ctx.lineTo(toX(-2), toY(0));
          ctx.lineTo(toX(1), toY(3));
          ctx.lineTo(toX(4), toY(0));
          ctx.lineTo(toX(11), toY(7));
          ctx.stroke();

          drawCoordPoint(toX(1), toY(3), "Пик (1; 3)", "#10B981");

          if (s >= 3) {
            const a = state.algA;
            const py = toY(a);
            ctx.strokeStyle = "#0085FF";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(0, py); ctx.lineTo(W, py);
            ctx.stroke();

            // Roots of ||x - 1| - 3| = a
            const roots = [];
            if (a >= 0) {
              const cands = [1 - (3 + a), 1 + (3 + a), 1 - (3 - a), 1 + (3 - a)];
              cands.forEach(rx => {
                if (Math.abs(Math.abs(Math.abs(rx - 1) - 3) - a) < 0.05) {
                  if (!roots.some(u => Math.abs(u - rx) < 0.08)) roots.push(rx);
                }
              });
            }
            roots.forEach(rx => {
              drawCoordPoint(toX(rx), py, `x=${rx.toFixed(1)}`, roots.length === 3 ? "#10B981" : "#0085FF");
            });

            ctx.fillStyle = "#0085FF";
            ctx.font = "800 13px 'Inter', sans-serif";
            ctx.fillText(`Прямая y = a = ${a.toFixed(2)}  (корней: ${roots.length})`, 24, py - 10);
          }
        }
        ctx.restore();
      } else if (state.taskId === "a_pencil") {
        ctx.save();
        // Step >= 1: Draw Rhombus |x| + |y| = 4
        if (s >= 1) {
          ctx.fillStyle = "rgba(0, 133, 255, 0.07)";
          ctx.strokeStyle = isDark ? "#F8FAFC" : "#0F172A";
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(toX(4), toY(0));
          ctx.lineTo(toX(0), toY(4));
          ctx.lineTo(toX(-4), toY(0));
          ctx.lineTo(toX(0), toY(-4));
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
          drawCoordPoint(toX(0), toY(4), "A(0; 4)", "#0085FF");
          drawCoordPoint(toX(0), toY(-4), "C(0; −4)", "#0085FF");
        }

        // Step >= 3: Shade the valid cone between a = -0.6 and a = 1
        if (s >= 3) {
          ctx.fillStyle = "rgba(16, 185, 129, 0.12)";
          ctx.beginPath();
          ctx.moveTo(toX(5), toY(1));
          ctx.lineTo(toX(-6), toY(-0.6 * (-11) + 1));
          ctx.lineTo(toX(-6), toY(1.0 * (-11) + 1));
          ctx.closePath();
          ctx.fill();
        }

        // Rotating Line y = a(x - 5) + 1
        const a = s === 0 ? 0.25 : (s === 2 ? -0.6 : state.algA);
        ctx.strokeStyle = "#0085FF";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(toX(-10), toY(a * (-15) + 1));
        ctx.lineTo(toX(10), toY(a * 5 + 1));
        ctx.stroke();

        // Pivot point P(5; 1)
        drawCoordPoint(toX(5), toY(1), "Шарнир P(5; 1)", "#F59E0B");
        ctx.restore();
      } else if (state.taskId === "a_circle") {
        ctx.save();
        // V-shape y = |x|
        ctx.strokeStyle = isDark ? "#F8FAFC" : "#0F172A";
        ctx.lineWidth = 3.2;
        ctx.beginPath();
        ctx.moveTo(toX(-8), toY(8));
        ctx.lineTo(toX(0), toY(0));
        ctx.lineTo(toX(8), toY(8));
        ctx.stroke();

        if (s >= 1) {
          const a = state.algA;
          const R = 3;
          ctx.strokeStyle = "#0085FF";
          ctx.fillStyle = "rgba(0, 133, 255, 0.08)";
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(toX(0), toY(a), R * scale, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          drawCoordPoint(toX(0), toY(a), `Центр (0; ${a.toFixed(2)})`, "#0085FF");
          if (Math.abs(a - 3) < 0.08) {
            drawCoordPoint(toX(0), toY(0), "Корень в острие (0; 0)!", "#10B981");
            drawCoordPoint(toX(3), toY(3), "(3; 3)", "#10B981");
            drawCoordPoint(toX(-3), toY(3), "(−3; 3)", "#10B981");
          }
        }
        ctx.restore();
      }
    }

    function drawCoordPoint(px, py, label, color) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(px, py, 6.5, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = "#FFFFFF";
      ctx.stroke();
      if (label) {
        ctx.fillStyle = color;
        ctx.font = "800 12px 'Inter', sans-serif";
        ctx.fillText(label, px + 10, py - 8);
      }
      ctx.restore();
    }

    function renderLogicScene() {
      const s = state.stepIdx;
      const cx = W / 2, cy = H / 2;
      const isDark = document.body.classList.contains("dark-mode");

      if (state.taskId === "l_ring") {
        const N = 13;
        const R = 172;

        // Step 1: Weak estimate (3 yellow arcs of 4 cells: 0..3, 4..7, 8..11, leaving cell 12 alone)
        if (s === 1) {
          for (let g = 0; g < 3; g++) {
            const a1 = ((g * 4) * 2 * Math.PI) / N - Math.PI / 2;
            const a2 = ((g * 4 + 3) * 2 * Math.PI) / N - Math.PI / 2;
            ctx.save();
            ctx.strokeStyle = "#F59E0B";
            ctx.lineWidth = 8;
            ctx.lineCap = "round";
            ctx.beginPath();
            ctx.arc(cx, cy, R + 38, a1, a2);
            ctx.stroke();
            ctx.restore();
          }
        }
        // Step >= 2: Exact estimate (Anchor on cell 0 + 3 blue arcs of 4 cells on 1..4, 5..8, 9..12!)
        else if (s >= 2) {
          for (let g = 0; g < 3; g++) {
            const a1 = ((1 + g * 4) * 2 * Math.PI) / N - Math.PI / 2;
            const a2 = ((1 + g * 4 + 3) * 2 * Math.PI) / N - Math.PI / 2;
            ctx.save();
            ctx.strokeStyle = "#0085FF";
            ctx.lineWidth = 8;
            ctx.lineCap = "round";
            ctx.beginPath();
            ctx.arc(cx, cy, R + 38, a1, a2);
            ctx.stroke();
            ctx.restore();
          }
        }

        // Draw 13 cells around the circle
        let negCount = 0;
        let badWindows = 0;
        for (let i = 0; i < N; i++) {
          if (state.ringVals[i] < 0) negCount++;
          let s4 = 0;
          for (let k = 0; k < 4; k++) s4 += state.ringVals[(i + k) % N];
          if (s4 <= 0) badWindows++;
        }

        for (let i = 0; i < N; i++) {
          const ang = (i * 2 * Math.PI) / N - Math.PI / 2;
          const x = cx + R * Math.cos(ang), y = cy + R * Math.sin(ang);
          const v = state.ringVals[i];
          const isPos = v > 0;
          const isAnchor = (s === 2 && i === 0);

          ctx.save();
          ctx.beginPath();
          ctx.arc(x, y, 24, 0, Math.PI * 2);
          if (s < 3 && !isAnchor) {
            ctx.fillStyle = isDark ? "#1E293B" : "#FFFFFF";
            ctx.strokeStyle = "#94A3B8";
          } else {
            ctx.fillStyle = isPos ? "#ECFDF5" : "#FEF3F2";
            ctx.strokeStyle = isPos ? "#10B981" : "#F04438";
          }
          ctx.lineWidth = 3;
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = (s < 3 && !isAnchor) ? (isDark ? "#F8FAFC" : "#0F172A") : (isPos ? "#065F46" : "#991B1B");
          ctx.font = "800 13px 'JetBrains Mono', monospace";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          const txt = s < 3 ? (isAnchor ? "ЯКОРЬ +" : `#${i + 1}`) : (isPos ? "+10" : "−1");
          ctx.fillText(txt, x, y);
          ctx.restore();
        }

        // Center explanation text
        ctx.save();
        ctx.textAlign = "center";
        ctx.fillStyle = isDark ? "#F8FAFC" : "#0F172A";
        ctx.font = "800 15px 'Inter', sans-serif";
        if (s === 1) {
          ctx.fillText("Слабая оценка: 3 дуги по 4 ячейки + 1 лишняя ячейка (#13)", cx, cy - 10);
          ctx.fillStyle = "#F59E0B";
          ctx.fillText("Даёт лишь ≤ 10 отрицательных чисел", cx, cy + 16);
        } else if (s === 2) {
          ctx.fillText("Точная оценка: 1 якорь (+) и ровно 3 дуги по 4 ячейки", cx, cy - 10);
          ctx.fillStyle = "#0085FF";
          ctx.fillText("Плюсов ≥ 1 + 3 = 4  ⇒  Отрицательных ≤ 9!", cx, cy + 16);
        } else {
          ctx.fillText(`Отрицательных чисел: ${negCount} из 13`, cx, cy - 12);
          ctx.fillStyle = badWindows === 0 ? "#10B981" : "#F04438";
          ctx.fillText(badWindows === 0 ? "✅ Сумма любых 4 подряд равна +7 > 0!" : `❌ Найдено ${badWindows} четвёрок с суммой ≤ 0!`, cx, cy + 16);
        }
        ctx.restore();
      } else if (state.taskId === "l_inv") {
        // 3 Numbers on the Blackboard
        const nums = state.invNums;
        const sum = nums[0] + nums[1] + nums[2];
        ctx.save();
        ctx.textAlign = "center";
        for (let i = 0; i < 3; i++) {
          const bx = cx + (i - 1) * 225 - 90;
          const by = 85;
          const isEven = nums[i] % 2 === 0;
          ctx.fillStyle = isEven ? "#EBF5FF" : "#FFFBEB";
          ctx.strokeStyle = isEven ? "#0085FF" : "#F59E0B";
          ctx.lineWidth = 2.8;
          ctx.beginPath();
          ctx.roundRect(bx, by, 180, 125, 18);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = "#475467";
          ctx.font = "700 12px 'Inter', sans-serif";
          ctx.fillText(`Число #${i + 1}`, bx + 90, by + 28);

          ctx.fillStyle = "#0F172A";
          ctx.font = "900 30px 'JetBrains Mono', monospace";
          ctx.fillText(String(nums[i]), bx + 90, by + 68);

          ctx.fillStyle = isEven ? "#0085FF" : "#B45309";
          ctx.font = "800 12px 'Inter', sans-serif";
          ctx.fillText(isEven ? "ЧЁТНОЕ" : "НЕЧЁТНОЕ", bx + 90, by + 102);
        }

        // Step-by-step formula box below cards
        ctx.fillStyle = isDark ? "#1E293B" : "#FFFFFF";
        ctx.strokeStyle = "#CBD5E1";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(cx - 320, 255, 640, 210, 18);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = isDark ? "#F8FAFC" : "#0F172A";
        ctx.font = "800 16px 'Inter', sans-serif";
        ctx.fillText(`Инвариант суммы: ${nums[0]} + ${nums[1]} + ${nums[2]} = ${sum} (не меняется!)`, cx, 298);

        if (s >= 2) {
          ctx.fillStyle = "#F59E0B";
          ctx.font = "700 14.5px 'Inter', sans-serif";
          ctx.fillText("Если бы получились три равных числа (k, k, k), то 3k = 2325 ⇒ k = 775.", cx, 342);
        }
        if (s >= 3) {
          ctx.fillStyle = "#F04438";
          ctx.font = "800 15px 'Inter', sans-serif";
          ctx.fillText("Но на последнем шаге одно из чисел получилось как 2y (ЧЁТНОЕ)!", cx, 388);
          ctx.fillText("А число 775 — НЕЧЁТНОЕ (775 ≠ 2y). Противоречие!", cx, 418);
        }
        ctx.restore();
      } else if (state.taskId === "l_game") {
        // Strip 1 x 17
        const N = 17;
        const cellW = Math.min(44, (W - 60) / N);
        const x0 = (W - cellW * N) / 2;
        const rowY = cy + 10;

        ctx.save();
        ctx.textAlign = "center";

        // Period 4 arches on Step >= 2
        if (s >= 2) {
          for (let p = 17; p - 4 >= 1; p -= 4) {
            if (s === 1 && p < 17) continue;
            const ax1 = x0 + (p - 4 - 0.5) * cellW;
            const ax2 = x0 + (p - 0.5) * cellW;
            ctx.strokeStyle = "#F04438";
            ctx.lineWidth = 2.5;
            ctx.setLineDash([5, 4]);
            ctx.beginPath();
            ctx.moveTo(ax2, rowY - 34);
            ctx.quadraticCurveTo((ax1 + ax2) / 2, rowY - 88, ax1, rowY - 34);
            ctx.stroke();
            ctx.setLineDash([]);
            ctx.fillStyle = "#F04438";
            ctx.font = "800 11px 'Inter', sans-serif";
            ctx.fillText("−4 клетки", (ax1 + ax2) / 2, rowY - 66);
          }
        }

        for (let i = 1; i <= N; i++) {
          const x = x0 + (i - 1) * cellW;
          const isRedTrap = (17 - i) % 4 === 0;
          const showColor = (s === 1 && i >= 13) || (s >= 2);

          ctx.fillStyle = !showColor ? (isDark ? "#1E293B" : "#FFFFFF") : (isRedTrap ? "#FEF3F2" : "#ECFDF5");
          ctx.strokeStyle = !showColor ? "#94A3B8" : (isRedTrap ? "#F04438" : "#10B981");
          ctx.lineWidth = i === state.gamePos ? 3.5 : 2;
          ctx.beginPath();
          ctx.roundRect(x + 2, rowY - 28, cellW - 4, 56, 8);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = isDark ? "#E2E8F0" : "#0F172A";
          ctx.font = "800 12px 'JetBrains Mono', monospace";
          ctx.fillText(String(i), x + cellW / 2, rowY + 46);

          if (i === state.gamePos) {
            ctx.beginPath();
            ctx.arc(x + cellW / 2, rowY, 14, 0, Math.PI * 2);
            ctx.fillStyle = "#0085FF";
            ctx.fill();
            ctx.fillStyle = "#FFFFFF";
            ctx.font = "800 11px 'Inter', sans-serif";
            ctx.fillText("★", x + cellW / 2, rowY + 4);
          }
        }

        ctx.fillStyle = isDark ? "#F8FAFC" : "#0F172A";
        ctx.font = "800 15px 'Inter', sans-serif";
        ctx.fillText(state.gameMsg, cx, rowY + 105);
        ctx.restore();
      }
    }

    function renderComboScene() {
      const s = state.stepIdx;
      const cx = W / 2;
      const isDark = document.body.classList.contains("dark-mode");

      if (state.taskId === "c_stars") {

        ctx.font = "800 16px 'Inter', sans-serif";

            ctx.fillStyle = "#0085FF";
            ctx.font = "800 12px 'Inter', sans-serif";

        ctx.restore();
      } else if (state.taskId === "c_pairs") {

          const [p1, p2] = pairs[t];

        ctx.fillStyle = isDark ? "#F8FAFC" : "#0F172A";
        ctx.font = "900 26px 'JetBrains Mono', monospace";
        ctx.fillText(`Различных способов: ${ways}`, cx, 345);

        ctx.fillStyle = "#475467";
        ctx.font = "700 14px 'Inter', sans-serif";
        ctx.fillText(`Формула: 6! ${state.pairGlueIn ? "÷ 2³ (внутри пар)" : ""} ${state.pairGlueTab ? "÷ 3! (между столами)" : ""} = ${ways}`, cx, 395);
        ctx.restore();

    }

    function renderGeomScene() {
      const s = state.stepIdx;
      const isDark = document.body.classList.contains("dark-mode");

      if (state.taskId === "m_median") {
        const A = state.geomA, B = state.geomB, C = state.geomC;
        const M = { x: (A.x + C.x) / 2, y: (A.y + C.y) / 2 };
        const t = state.geomRotT;
        const ang = Math.PI * t;
        const rot = pt => {
          const dx = pt.x - M.x, dy = pt.y - M.y;
          return {
            x: M.x + dx * Math.cos(ang) - dy * Math.sin(ang),
            y: M.y + dx * Math.sin(ang) + dy * Math.cos(ang)
          };
        };
        const D = rot(B);
        const Ap = rot(A);

        ctx.save();
        // Highlight triangle BCD on Step >= 3
        if (s >= 3 && t > 0.95) {
          ctx.fillStyle = "rgba(16, 185, 129, 0.16)";
          ctx.beginPath();
          ctx.moveTo(B.x, B.y); ctx.lineTo(C.x, C.y); ctx.lineTo(D.x, D.y);
          ctx.closePath();
          ctx.fill();
        }

        // Base Triangle ABC
        ctx.fillStyle = "rgba(0, 133, 255, 0.07)";
        ctx.strokeStyle = isDark ? "#F8FAFC" : "#0F172A";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y); ctx.lineTo(C.x, C.y);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Median BM
        ctx.strokeStyle = "#0085FF";
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.moveTo(B.x, B.y); ctx.lineTo(M.x, M.y);
        ctx.stroke();

        // Rotated Triangle M - Ap - D
        if (t > 0.01) {
          ctx.strokeStyle = "#10B981";
          ctx.lineWidth = 3;
          ctx.setLineDash([7, 5]);
          ctx.beginPath();
          ctx.moveTo(M.x, M.y); ctx.lineTo(D.x, D.y);
          ctx.lineTo(Ap.x, Ap.y); ctx.closePath();
          ctx.stroke();
          ctx.setLineDash([]);
        }

        drawCoordPoint(A.x, A.y, "A", "#0085FF");
        drawCoordPoint(B.x, B.y, "B", "#0085FF");
        drawCoordPoint(C.x, C.y, "C", "#0085FF");
        drawCoordPoint(M.x, M.y, "M (середина AC)", "#F59E0B");
        if (t > 0.05) drawCoordPoint(D.x, D.y, "D (CD = AB, BD = 2·BM)", "#10B981");
        ctx.restore();
      } else if (state.taskId === "m_circle") {
        const A = state.cirA, B = state.cirB, C = state.cirC, D = state.cirD;
        const circ = getCircumcircle(A, B, D);
        const angABD = getAngleDeg(A, B, D);
        const angACD = getAngleDeg(A, C, D);
        const onCircle = Math.abs(angABD - angACD) < 2.2;

        ctx.save();
        // Auxiliary Circle on Step >= 2
        if (s >= 2 && circ) {
          ctx.strokeStyle = onCircle ? "#10B981" : "#0085FF";
          ctx.lineWidth = onCircle ? 3.5 : 2.2;
          ctx.setLineDash(onCircle ? [] : [7, 5]);
          ctx.beginPath();
          ctx.arc(circ.x, circ.y, circ.r, 0, Math.PI * 2);
          ctx.stroke();
          ctx.setLineDash([]);
        }

        // Quadrilateral ABCD
        ctx.strokeStyle = isDark ? "#F8FAFC" : "#0F172A";
        ctx.lineWidth = 2.6;
        ctx.beginPath();
        ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y);
        ctx.lineTo(C.x, C.y); ctx.lineTo(D.x, D.y);
        ctx.closePath();
        ctx.stroke();

        // Highlight base AD on Step 1
        if (s === 1) {
          ctx.strokeStyle = "#0085FF";
          ctx.lineWidth = 5;
          ctx.beginPath();
          ctx.moveTo(A.x, A.y); ctx.lineTo(D.x, D.y);
          ctx.stroke();
        }

        // Highlight chord CD on Step 3
        if (s === 3) {
          ctx.strokeStyle = "#10B981";
          ctx.lineWidth = 5;
          ctx.beginPath();
          ctx.moveTo(C.x, C.y); ctx.lineTo(D.x, D.y);
          ctx.stroke();
        }

        // Diagonals AC and BD
        ctx.strokeStyle = "#0085FF";
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.moveTo(A.x, A.y); ctx.lineTo(C.x, C.y);
        ctx.moveTo(B.x, B.y); ctx.lineTo(D.x, D.y);
        ctx.stroke();

        drawCoordPoint(A.x, A.y, "A", "#0085FF");
        drawCoordPoint(B.x, B.y, `B (∠ABD = ${angABD.toFixed(0)}°)`, "#0085FF");
        drawCoordPoint(C.x, C.y, `C (∠ACD = ${angACD.toFixed(0)}°)`, onCircle ? "#10B981" : "#F04438");
        drawCoordPoint(D.x, D.y, "D", "#0085FF");
        ctx.restore();
      }
    }

    function getCircumcircle(p1, p2, p3) {
      const D = 2 * (p1.x * (p2.y - p3.y) + p2.x * (p3.y - p1.y) + p3.x * (p1.y - p2.y));
      if (Math.abs(D) < 1e-4) return null;
      const ux = ((p1.x ** 2 + p1.y ** 2) * (p2.y - p3.y) + (p2.x ** 2 + p2.y ** 2) * (p3.y - p1.y) + (p3.x ** 2 + p3.y ** 2) * (p1.y - p2.y)) / D;
      const uy = ((p1.x ** 2 + p1.y ** 2) * (p3.x - p2.x) + (p2.x ** 2 + p2.y ** 2) * (p1.x - p3.x) + (p3.x ** 2 + p3.y ** 2) * (p2.x - p1.x)) / D;
      return { x: ux, y: uy, r: Math.hypot(p1.x - ux, p1.y - uy) };
    }

    function getAngleDeg(A, V, B) {
      const v1x = A.x - V.x, v1y = A.y - V.y;
      const v2x = B.x - V.x, v2y = B.y - V.y;
      const dot = v1x * v2x + v1y * v2y;
      const len = Math.hypot(v1x, v1y) * Math.hypot(v2x, v2y);
      if (len < 1e-5) return 0;
      return (Math.acos(Math.max(-1, Math.min(1, dot / len))) * 180) / Math.PI;
    }

    window.doInvStep = function(i, j) {
      const x = state.invNums[i], y = state.invNums[j];
      state.invNums[i] = x - y;
      state.invNums[j] = 2 * y;
    };

    window.doGameMove = function(k) {
      if (state.gamePos >= 17) return;
      const p1 = Math.min(17, state.gamePos + k);
      const reply = 4 - k;
      const p2 = Math.min(17, p1 + reply);
      state.gamePos = p2;
      state.gameMsg = `Ты сходил +${k} (на клетку ${p1}), Второй игрок ответил дополнением +${reply} (4−${k}) и встал на красную клетку ${p2}!`;
    };

    window.moveComboBall = function(from, to) {
      const minVal = state.comboEmpty ? 0 : 1;
      if (state.comboBoxes[from] > minVal) {
        state.comboBoxes[from]--;
        state.comboBoxes[to]++;
      }
    };

    // Pointer Interaction on Canvas
    canvas.addEventListener("pointerdown", e => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left, y = e.clientY - rect.top;

      if (state.taskId === "g_tree" && state.stepIdx === 4) {
        // Allow clicking a leaf (degree 1) to prune it!
        const aliveNodes = state.nodes.filter(n => n.alive !== false);
        const aliveEdges = state.edges.filter(ed => ed.alive !== false);
        const hit = aliveNodes.find(n => Math.hypot(n.x - x, n.y - y) <= 26);
        if (hit && aliveNodes.length > 1) {
          const inc = aliveEdges.filter(ed => ed.u === hit.id || ed.v === hit.id);
          if (inc.length === 1) {
            addRing(hit.x, hit.y, "#10B981", 55);
            hit.alive = false;
            inc[0].alive = false;
          }
        }
      } else if (state.taskId === "g_king") {
        const hit = state.nodes.find(n => Math.hypot(n.x - x, n.y - y) <= 26);
        if (hit) {
          triggerKingRadarParticles(hit.id);
        }
      } else if (state.taskId === "l_ring") {
        const N = 13, R = 172, cx = W / 2, cy = H / 2;
        for (let i = 0; i < N; i++) {
          const ang = (i * 2 * Math.PI) / N - Math.PI / 2;
          const nx = cx + R * Math.cos(ang), ny = cy + R * Math.sin(ang);
          if (Math.hypot(x - nx, y - ny) <= 26) {
            state.ringVals[i] = state.ringVals[i] > 0 ? -1 : 10;
            break;
          }
        }
      } else if (state.secId === "geom") {
        const pts = state.taskId === "m_median" ? [state.geomA, state.geomB, state.geomC] : [state.cirA, state.cirB, state.cirC, state.cirD];
        for (const pt of pts) {
          if (Math.hypot(pt.x - x, pt.y - y) <= 22) {
            state.draggingGeomPt = pt;
            break;
          }
        }
      }
    });

    canvas.addEventListener("pointermove", e => {
      if (!state.draggingGeomPt) return;
      const rect = canvas.getBoundingClientRect();
      state.draggingGeomPt.x = Math.max(40, Math.min(W - 40, e.clientX - rect.left));
      state.draggingGeomPt.y = Math.max(40, Math.min(H - 40, e.clientY - rect.top));
    });

    window.addEventListener("pointerup", () => {
      state.draggingGeomPt = null;
    });

      document.getElementById("tasksRow").innerHTML = sec.tasks.map(t => `
        <button class="task-pill-card ${t.id === state.taskId ? 'active' : ''}" onclick="selectTask('${t.id}')">
          <span class="task-pill-num">${t.num}</span>
          <div class="task-pill-title">${t.title}</div>
          <div class="task-pill-sub">${t.sub}</div>
        </button>
      `).join("");

      // 3. Problem Statement
      const probEl = document.getElementById("probStatement");
      probEl.innerHTML = task.statement;
      renderMathIn(probEl);

      // 4. 5-Step Stepper
      document.getElementById("stepsStepper").innerHTML = task.steps.map((_, idx) => `
        <button class="step-dot-btn ${idx === state.stepIdx ? 'active' : (idx < state.stepIdx ? 'done' : '')}"
          onclick="selectStep(${idx})">
          Шаг ${idx + 1}
        </button>
      `).join("");

      // 5. Current Step Lesson Card
      document.getElementById("stepBadge").textContent = `ШАГ ${state.stepIdx + 1} ИЗ ${task.steps.length}`;
      document.getElementById("stepTitle").textContent = step.title;
      const bulletsEl = document.getElementById("stepBullets");
      bulletsEl.innerHTML = step.bullets.map(b => `<div>${b}</div>`).join("");
      renderMathIn(bulletsEl);

      const takeawayEl = document.getElementById("stepTakeaway");
      takeawayEl.textContent = step.takeaway;

      // 6. Prev / Next Step Buttons
      const prevBtn = document.getElementById("btnPrevStep");
      const nextBtn = document.getElementById("btnNextStep");
      prevBtn.disabled = state.stepIdx === 0;
      if (state.stepIdx < task.steps.length - 1) {
        nextBtn.textContent = `Следующий шаг (Шаг ${state.stepIdx + 2}) →`;
      } else {
        nextBtn.textContent = `↺ Начать разбор с Шага 1`;
      }

      // 7. Right Stage Titles & Caption
      document.getElementById("stageStepPill").textContent = `Шаг ${state.stepIdx + 1} из ${task.steps.length}`;
      document.getElementById("stageHeading").textContent = step.title;
      document.getElementById("stageCaption").textContent = step.caption;

      initCurrentStepScene();
    }

    window.selectSection = function(secId) {
      state.secId = secId;
      state.taskId = SECTIONS[secId].tasks[0].id;
      state.stepIdx = 0;
      syncUI();
    };

    window.selectTask = function(taskId) {
      state.taskId = taskId;
      state.stepIdx = 0;
      syncUI();
    };

    window.selectStep = function(idx) {
      state.stepIdx = idx;
      syncUI();
    };

    window.replayStepAnimation = function() {
      initCurrentStepScene();
    };

    document.getElementById("btnPrevStep").addEventListener("click", () => {
      if (state.stepIdx > 0) selectStep(state.stepIdx - 1);
    });

    document.getElementById("btnNextStep").addEventListener("click", () => {
      const task = SECTIONS[state.secId].tasks.find(t => t.id === state.taskId);
      if (state.stepIdx < task.steps.length - 1) {
        selectStep(state.stepIdx + 1);
      } else {
        selectStep(0);
      }
    });

    document.getElementById("btnThemeSwitch").addEventListener("click", () => {
      const isDark = document.body.classList.toggle("dark-mode");
      document.getElementById("themeSun").classList.toggle("active", !isDark);
      document.getElementById("themeMoon").classList.toggle("active", isDark);
    });

    window.addEventListener("DOMContentLoaded", () => {
      resizeCanvas();
      syncUI();
      setTimeout(syncUI, 280);
      requestAnimationFrame(renderCanvasFrame);
    });
  </script>
</body>
</html>
