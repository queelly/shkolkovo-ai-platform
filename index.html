<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ШКОЛКОВО · Интерактивные олимпиадные лаборатории (8–11 класс)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@600;700;800&display=swap" rel="stylesheet">
  <!-- KaTeX CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" crossorigin="anonymous">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>

  <style>
    :root {
      --shk-blue: #0085FF;
      --shk-blue-hover: #006CD1;
      --shk-blue-soft: #EBF5FF;
      --shk-navy: #0B192C;
      --shk-slate: #DFE4EC;
      --shk-card: #FFFFFF;
      --shk-subtle: #F4F6FA;
      --shk-text: #0F172A;
      --shk-text-sec: #475467;
      --shk-border: #E4E7EC;
      --shk-green: #10B981;
      --shk-green-soft: #ECFDF5;
      --shk-red: #F04438;
      --shk-red-soft: #FEF3F2;
      --shk-amber: #F59E0B;
      --shk-amber-soft: #FFFBEB;
      --radius-lg: 22px;
      --radius-md: 14px;
    }

    body.dark-mode {
      --shk-slate: #0F172A;
      --shk-card: #1E293B;
      --shk-subtle: #0B111E;
      --shk-text: #F8FAFC;
      --shk-text-sec: #CBD5E1;
      --shk-border: #334155;
      --shk-blue-soft: rgba(0, 133, 255, 0.16);
      --shk-green-soft: rgba(16, 185, 129, 0.16);
      --shk-red-soft: rgba(240, 68, 56, 0.16);
      --shk-amber-soft: rgba(245, 158, 11, 0.16);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--shk-slate);
      color: var(--shk-text);
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    /* 1. SHKOLKOVO HEADER */
    .shk-header {
      background: var(--shk-card);
      border-bottom: 1px solid var(--shk-border);
      height: 64px;
      padding: 0 24px;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .shk-header-inner {
      max-width: 1520px;
      height: 100%;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .shk-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--shk-text);
      flex-shrink: 0;
    }

    .shk-logo-word {
      font-weight: 900;
      font-size: 18px;
      letter-spacing: 0.06em;
    }

    .sec-nav {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
    }

    .sec-tab {
      border: none;
      background: transparent;
      color: var(--shk-text-sec);
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 10px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.16s ease;
    }

    .sec-tab:hover {
      background: var(--shk-subtle);
      color: var(--shk-blue);
    }

    .sec-tab.active {
      background: var(--shk-blue);
      color: #FFFFFF;
      box-shadow: 0 3px 10px rgba(0, 133, 255, 0.25);
    }

    .theme-btn {
      background: var(--shk-subtle);
      border: 1px solid var(--shk-border);
      border-radius: 10px;
      padding: 6px 10px;
      cursor: pointer;
      font-size: 14px;
      color: var(--shk-text);
    }

    /* 2. MAIN WORKSPACE */
    .workspace {
      max-width: 1520px;
      margin: 0 auto;
      padding: 16px 24px 32px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* COMPACT TASK SWITCHER */
    .task-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
    }

    .task-btn {
      background: var(--shk-card);
      border: 2px solid transparent;
      border-radius: 15px;
      padding: 11px 15px;
      text-align: left;
      cursor: pointer;
      transition: all 0.16s ease;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.04);
    }

    .task-btn:hover {
      border-color: #90C8FF;
      transform: translateY(-1px);
    }

    .task-btn.active {
      border-color: var(--shk-blue);
      box-shadow: 0 6px 16px rgba(0, 133, 255, 0.14);
    }

    .task-btn-num {
      font-size: 10.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--shk-blue);
    }

    .task-btn-title {
      font-size: 13.5px;
      font-weight: 800;
      color: var(--shk-text);
      margin-top: 2px;
    }

    /* TWO-ISLAND GRID: 33% LEFT (CONCISE GUIDE) / 67% RIGHT (PLAYABLE STAGE) */
    .main-grid {
      display: grid;
      grid-template-columns: 390px 1fr;
      gap: 18px;
      align-items: stretch;
    }

    @media (max-width: 1080px) {
      .main-grid {
        grid-template-columns: 1fr;
      }
    }

    .island {
      background: var(--shk-card);
      border-radius: var(--radius-lg);
      padding: 20px 22px;
      box-shadow: 0 4px 18px rgba(15, 23, 42, 0.04);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* CONCISE PROBLEM STATEMENT */
    .cond-card {
      background: var(--shk-subtle);
      border-radius: 13px;
      padding: 12px 14px;
      border-left: 4px solid var(--shk-navy);
      font-size: 13px;
      color: var(--shk-text);
      line-height: 1.5;
    }

    .cond-label {
      font-size: 10.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--shk-blue);
      margin-bottom: 3px;
    }

    /* 4-STEP COMPACT TABS */
    .step-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .step-tab {
      border: 1.5px solid var(--shk-border);
      background: var(--shk-card);
      color: var(--shk-text-sec);
      font-family: inherit;
      font-size: 12px;
      font-weight: 800;
      padding: 8px 4px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .step-tab.done {
      background: var(--shk-blue-soft);
      border-color: #90C8FF;
      color: var(--shk-blue);
    }

    .step-tab.active {
      background: var(--shk-blue);
      border-color: var(--shk-blue);
      color: #FFFFFF;
      box-shadow: 0 3px 10px rgba(0, 133, 255, 0.25);
    }

    /* ACTIVE STEP BODY (SHORT & PUNCHY!) */
    .step-card {
      background: var(--shk-subtle);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
    }

    .step-card-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--shk-text);
      line-height: 1.3;
    }

    /* HANDS-ON ACTION PROMPT BOX */
    .try-box {
      background: var(--shk-blue-soft);
      border: 1.5px solid rgba(0, 133, 255, 0.35);
      border-radius: 12px;
      padding: 11px 13px;
      font-size: 13px;
      font-weight: 700;
      color: var(--shk-text);
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .step-short-text {
      font-size: 13.5px;
      color: var(--shk-text-sec);
      line-height: 1.55;
    }

    .aha-box {
      margin-top: auto;
      background: var(--shk-green-soft);
      border-left: 4px solid var(--shk-green);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--shk-text);
    }

    .nav-btns {
      display: flex;
      gap: 8px;
    }

    .btn-prev {
      background: var(--shk-subtle);
      color: var(--shk-text);
      border: 1px solid var(--shk-border);
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      padding: 11px 15px;
      border-radius: 11px;
      cursor: pointer;
    }

    .btn-prev:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-next {
      flex: 1;
      background: var(--shk-blue);
      color: #FFFFFF;
      border: none;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 800;
      padding: 11px 16px;
      border-radius: 11px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0, 133, 255, 0.28);
      transition: background 0.15s;
    }

    .btn-next:hover {
      background: var(--shk-blue-hover);
    }

    /* RIGHT ISLAND: INTERACTIVE STAGE */
    .stage-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .status-chips {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .chip {
      background: var(--shk-subtle);
      border: 1px solid var(--shk-border);
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--shk-text);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .chip.ok {
      background: var(--shk-green-soft);
      border-color: var(--shk-green);
      color: #065F46;
    }

    .chip.err {
      background: var(--shk-red-soft);
      border-color: var(--shk-red);
      color: #991B1B;
    }

    body.dark-mode .chip.ok, body.dark-mode .chip.err {
      color: #F8FAFC;
    }

    .stage-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .act-btn {
      background: var(--shk-blue-soft);
      color: var(--shk-blue);
      border: 1px solid rgba(0, 133, 255, 0.3);
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 700;
      padding: 7px 12px;
      border-radius: 9px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .act-btn:hover, .act-btn.primary {
      background: var(--shk-blue);
      color: #FFFFFF;
    }

    .canvas-container {
      position: relative;
      width: 100%;
      height: 550px;
      border-radius: 18px;
      background: #F8FAFC;
      border: 1.5px solid var(--shk-border);
      overflow: hidden;
      user-select: none;
    }

    body.dark-mode .canvas-container {
      background: #0B111E;
    }

    canvas#stageCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="shk-header">
    <div class="shk-header-inner">
      <a href="#" class="shk-logo" onclick="selectSec('graphs'); return false;">
        <svg width="34" height="34" viewBox="0 0 40 40" fill="none">
          <line x1="6" y1="12" x2="2" y2="9" stroke="#1890FF" stroke-width="2.4" stroke-linecap="round"/>
          <line x1="11" y1="6" x2="9" y2="2" stroke="#1890FF" stroke-width="2.4" stroke-linecap="round"/>
          <line x1="17" y1="7" x2="19" y2="3" stroke="#1890FF" stroke-width="2.4" stroke-linecap="round"/>
          <g transform="rotate(-32 21 22)">
            <rect x="11" y="9" width="20" height="26" rx="3.5" fill="#1890FF"/>
            <circle cx="21" cy="16" r="2.6" fill="#FFFFFF"/>
            <rect x="14" y="23" width="14" height="8" rx="1.5" fill="#69B7FF" fill-opacity="0.55"/>
          </g>
        </svg>
        <span class="shk-logo-word">ШКОЛКОВО</span>
      </a>

      <nav class="sec-nav" id="secNav"></nav>

      <button class="theme-btn" id="themeBtn" title="Переключить тему">☀️ / 🌙</button>
    </div>
  </header>

  <!-- WORKSPACE -->
  <main class="workspace">
    <div class="task-bar" id="taskBar"></div>

    <div class="main-grid">
      <!-- LEFT ISLAND: CONCISE STEP GUIDE -->
      <aside class="island">
        <div class="cond-card">
          <div class="cond-label" id="condLabel">Задача</div>
          <div id="condText"></div>
        </div>

        <div class="step-tabs" id="stepTabs"></div>

        <div class="step-card">
          <h2 class="step-card-title" id="stepTitle"></h2>
          <div class="try-box">
            <span>🎯</span>
            <span id="stepTry"></span>
          </div>
          <div class="step-short-text" id="stepExplain"></div>
          <div id="stepCustomControls"></div>
          <div class="aha-box" id="stepAha"></div>
        </div>

        <div class="nav-btns">
          <button class="btn-prev" id="btnPrev">← Назад</button>
          <button class="btn-next" id="btnNext">Дальше: Шаг 2 →</button>
        </div>
      </aside>

      <!-- RIGHT ISLAND: PLAYABLE INTERACTIVE STAGE -->
      <section class="island">
        <div class="stage-header">
          <div class="status-chips" id="statusChips"></div>
          <div class="stage-actions" id="stageActions"></div>
        </div>

        <div class="canvas-container" id="canvasContainer">
          <canvas id="stageCanvas"></canvas>
        </div>
      </section>
    </div>
  </main>
  <script>
    // =========================================================================
    // 1. ULTRA-CONCISE HANDS-ON CURRICULUM (ALL 5 SECTIONS)
    // =========================================================================
    const DATA = {
      graphs: {
        id: "graphs",
        title: "🕸️ Теория графов",
        tasks: [
          {
            id: "knights",
            num: "Задача 1 · Инвариант на графе",
            title: "Четыре коня на доске 3 × 3",
            cond: "В углах доски $3 \\times 3$ стоят 2 белых коня ($a1, c3$ — по диагонали) и 2 чёрных ($a3, c1$). Можно ли ходами коня поменять белых и чёрных местами (не вставая вдвоём на одну клетку)?",
            steps: [
              {
                tab: "1 · Игра",
                title: "Попробуй переставить коней вручную",
                try: "Кликни на любого коня на доске, а затем на зелёную клетку, чтобы сделать прыжок!",
                explain: "Когда кони прыгают по доске, кажется, что вариантов много, но они постоянно мешают друг другу.",
                aha: "На обычной доске трудно понять, почему кони застревают."
              },
              {
                tab: "2 · Сетка",
                title: "Включаем рентген всех ходов коня",
                try: "Посмотри на синие линии прыжков и продолжи двигать коней по доске.",
                explain: "Из центра $b2$ конь вообще не может никуда прыгнуть! А остальные 8 клеток связаны в замкнутую восьмиконечную звезду.",
                aha: "У каждой из 8 крайних клеток ровно 2 соседа — это один замкнутый маршрут!"
              },
              {
                tab: "3 · Круг",
                title: "Распутываем звезду в обычный круг!",
                try: "Потяни ползунок «Развернуть в круг» (или нажми кнопку распутывания над холстом)!",
                explain: "Если переставить клетки по порядку прыжков ($a1 - b3 - c1 - a2 - c3 - b1 - a3 - c2$), запутанная звезда превращается в простой хоровод по кругу!",
                aha: "Прыжок коня на доске — это просто шаг на 1 соседнюю клетку по кругу!"
              },
              {
                tab: "4 · Вывод",
                title: "Почему кони никогда не обгонят друг друга?",
                try: "Сделай любой ход конём на доске слева и следи за ним на круге справа!",
                explain: "На круге кони стоят в чередовании <b>Белый — Чёрный — Белый — Чёрный</b> и не могут перепрыгнуть через соседа. Значит, порядок по кругу никогда не изменится (а если бы в начале стояли Б—Б—Ч—Ч, нельзя было бы получить Б—Ч—Б—Ч)!",
                aha: "Инвариант: циклический порядок коней на кольце из 8 клеток неизменен!"
              }
            ]
          },
          {
            id: "k33",
            num: "Задача 2 · Планарность",
            title: "Три домика и три колодца (K₃,₃)",
            cond: "Соедините 3 синих домика с каждым из 3 зелёных колодцев (всего 9 тропинок) так, чтобы тропинки не пересекались!",
            steps: [
              {
                tab: "1 · Проба",
                title: "Проложи тропинки своими руками!",
                try: "Кликай от домика к колодцу, чтобы провести тропинку, и перетаскивай кружки мышкой!",
                explain: "Попробуй провести все 9 тропинок и распутать вершины так, чтобы красных кружков пересечений стало 0.",
                aha: "8 тропинок легко укладываются без пересечений, но 9-я всегда что-то пересекает!"
              },
              {
                tab: "2 · Контур",
                title: "Первые 6 тропинок запирают контур",
                try: "Нажми «Показать 6 тропинок контура» над холстом или посмотри на шестиугольник.",
                explain: "Соединим по очереди $Д_1 - К_1 - Д_2 - К_2 - Д_3 - К_3 - Д_1$. Получился замкнутый шестиугольник, который делит плоскость на <b>Внутри</b> и <b>Снаружи</b>.",
                aha: "Осталось провести 3 тропинки: (Д₁–К₂), (Д₂–К₃) и (Д₃–К₁)."
              },
              {
                tab: "3 · Тупик",
                title: "7-я тропинка внутри, 8-я — снаружи, а 9-я в капкане!",
                try: "Попробуй перетащить любую вершину — красный крестик на 9-й тропинке не исчезает!",
                explain: "7-я тропинка ($Д_1—К_2$) перегородила внутреннюю область, а 8-я ($Д_2—К_3$) обогнула снаружи. Для 9-й тропинки ($Д_3—К_1$) путь закрыт с обеих сторон!",
                aha: "По теореме Жордана 9-я тропинка заперта барьерами и внутри, и снаружи."
              },
              {
                tab: "4 · Эйлер",
                title: "Доказательство в 2 строчки через формулу Эйлера",
                try: "Удали любую одну тропинку кликом — и оставшиеся 8 сразу лягут без пересечений!",
                explain: "По формуле Эйлера $V - E + F = 2$. Так как домики не соединены между собой, треугольников нет — у каждой грани $\\ge 4$ сторон ($4F \\le 2E$). Отсюда $E \\le 2V - 4 = 8$, а у нас $9$ тропинок!",
                aha: "Формула для чистовика: без треугольников E ≤ 2V − 4 = 8 < 9."
              }
            ]
          },
          {
            id: "trees",
            num: "Задача 3 · Деревья и Индукция",
            title: "Разборка дерева по листьям (E = V − 1)",
            cond: "Докажите, что в любом дереве (связном графе без циклов) число рёбер $E$ ровно на $1$ меньше числа вершин $V$: $E = V - 1$.",
            steps: [
              {
                tab: "1 · Опасность",
                title: "Что будет, если удалить внутреннюю развилку?",
                try: "Кликни мышкой по любой синей внутренней вершине дерева, чтобы проверить её!",
                explain: "Если удалить из дерева узловую развилку (степень $\\ge 2$), дерево развалится на несколько несвязных кусков! Для индукции такая вершина не годится.",
                aha: "Удалять можно только крайнюю висячую вершину (лист со степенью 1)!"
              },
              {
                tab: "2 · Путник",
                title: "Как гарантированно найти висячий лист?",
                try: "Нажми «🚶 Запустить путника» над холстом — он побежит до упора!",
                explain: "Если идти по дереву без разворотов назад, мы не можем ходить по кругу (циклов нет) и неизбежно упрёмся в тупик — <b>зелёный лист</b> (степень 1).",
                aha: "Конец самого длинного простого пути в дереве — всегда лист!"
              },
              {

    const canvas = document.getElementById("stageCanvas");

    function resizeCanvas() {
      const box = document.getElementById("canvasContainer");
      if (!box) return;
      const rect = box.getBoundingClientRect();
      if (rect.width < 10) return;
      W = rect.width;
      H = rect.height;
      const dpr = window.devicePixelRatio || 1;
      canvas.width = W * dpr;
      canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener("resize", resizeCanvas);

    function clearTimers() {
      app.timers.forEach(id => clearTimeout(id));
      app.timers = [];
      app.particles = [];
      app.rings = [];

    function later(ms, fn) {
      const id = setTimeout(fn, ms);
      app.timers.push(id);
    }

    function spawnRing(x, y, color = "#0085FF", maxR = 54) {
      app.rings.push({ x, y, r: 14, maxR, alpha: 0.9, color });
    }

    function spawnParticle(x0, y0, x1, y1, color = "#0085FF", duration = 420, onDone = null) {
      app.particles.push({ x0, y0, x1, y1, t: 0, step: 16 / Math.max(100, duration), color, onDone });
    }

    function tweenProp(obj, key, toVal, duration = 700, onUpdate = null) {
      const fromVal = obj[key];
      const t0 = performance.now();
      function step(now) {
        const p = Math.min(1, (now - t0) / duration);
        const k = p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
        obj[key] = fromVal + (toVal - fromVal) * k;
        if (onUpdate) onUpdate();
        if (p < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }

    // =========================================================================
    // 4. GEOMETRY & MATH HELPERS
    // =========================================================================
    function segIntersect(p1, p2, p3, p4) {
      const ccw = (A, B, C) => (C.y - A.y) * (B.x - A.x) > (B.y - A.y) * (C.x - A.x);
      if (
        (Math.hypot(p1.x - p3.x, p1.y - p3.y) < 2) ||
        (Math.hypot(p1.x - p4.x, p1.y - p4.y) < 2) ||
        (Math.hypot(p2.x - p3.x, p2.y - p3.y) < 2) ||
        (Math.hypot(p2.x - p4.x, p2.y - p4.y) < 2)
      ) return null;
      if (ccw(p1, p3, p4) !== ccw(p2, p3, p4) && ccw(p1, p2, p3) !== ccw(p1, p2, p4)) {
        const a1 = p2.y - p1.y, b1 = p1.x - p2.x, c1 = a1 * p1.x + b1 * p1.y;
        const a2 = p4.y - p3.y, b2 = p3.x - p4.x, c2 = a2 * p3.x + b2 * p3.y;
        const det = a1 * b2 - a2 * b1;
        if (Math.abs(det) < 1e-6) return null;
        return { x: (b2 * c1 - b1 * c2) / det, y: (a1 * c2 - a2 * c1) / det };
      }
      return null;
    }

    function getK33Crossings() {
      const crossings = [];
      for (let i = 0; i < app.k33Edges.length; i++) {
        for (let j = i + 1; j < app.k33Edges.length; j++) {
          const [u1, v1] = app.k33Edges[i];
          const [u2, v2] = app.k33Edges[j];
          if (u1 === u2 || u1 === v2 || v1 === u2 || v1 === v2) continue;
          const n1 = app.k33Nodes.find(n => n.id === u1);
          const n2 = app.k33Nodes.find(n => n.id === v1);
          const n3 = app.k33Nodes.find(n => n.id === u2);
          const n4 = app.k33Nodes.find(n => n.id === v2);
          if (!n1 || !n2 || !n3 || !n4) continue;
          const pt = segIntersect(n1, n2, n3, n4);
          if (pt) crossings.push({ pt, e1: i, e2: j });
        }
      }
      return crossings;
    }

    function getCircumcircle(A, B, C) {
      const D = 2 * (A.x * (B.y - C.y) + B.x * (C.y - A.y) + C.x * (A.y - B.y));
      if (Math.abs(D) < 1e-5) return null;
      const ux = ((A.x * A.x + A.y * A.y) * (B.y - C.y) + (B.x * B.x + B.y * B.y) * (C.y - A.y) + (C.x * C.x + C.y * C.y) * (A.y - B.y)) / D;
      const uy = ((A.x * A.x + A.y * A.y) * (C.x - B.x) + (B.x * B.x + B.y * B.y) * (A.x - C.x) + (C.x * C.x + C.y * C.y) * (B.x - A.x)) / D;
      return { x: ux, y: uy, r: Math.hypot(ux - A.x, uy - A.y) };
    }

    function angleDeg(P, V, Q) {
      const a1 = Math.atan2(P.y - V.y, P.x - V.x);
      const a2 = Math.atan2(Q.y - V.y, Q.x - V.x);
      let d = Math.abs(a1 - a2) * (180 / Math.PI);
      if (d > 180) d = 360 - d;
      return d;
    }

    window.snapCToCircle = function() {
      const circ = getCircumcircle(app.cirA, app.cirB, app.cirD);
      if (!circ) return;
      const ang = Math.atan2(app.cirC.y - circ.y, app.cirC.x - circ.x);
      const tx = circ.x + circ.r * Math.cos(ang);
      const ty = circ.y + circ.r * Math.sin(ang);
      tweenProp(app.cirC, "x", tx, 500);
      tweenProp(app.cirC, "y", ty, 500, () => {
        spawnRing(tx, ty, "#10B981", 52);
        updateChipsAndActions();
      });
    };

    function getTreeDegrees() {
      const deg = {};
      app.treeNodes.forEach(n => { if (n.alive) deg[n.id] = 0; });
      app.treeEdges.forEach(e => {
        if (e.alive && deg[e.u] !== undefined && deg[e.v] !== undefined) {
          deg[e.u]++;
          deg[e.v]++;
        }
      });
      return deg;
    }

    // 5. UI SYNC, CHIPS, QUICK ACTIONS & CUSTOM STEP CONTROLS
    // =========================================================================
    function renderMathIn(el) {
      if (window.renderMathInElement && el) {
        window.renderMathInElement(el, {
          delimiters: [
            { left: "$$", right: "$$", display: true },
            { left: "$", right: "$", display: false }
          ],
          throwOnError: false
        });
      }
    }

    function getSec() { return DATA[app.secId]; }
    function getTask() { return getSec().tasks.find(t => t.id === app.taskId) || getSec().tasks[0]; }

    function syncUI() {
      const sec = getSec();
      const task = getTask();
      const step = task.steps[app.stepIdx];

      // 1. Section Nav
      const secNav = document.getElementById("secNav");
      secNav.innerHTML = Object.values(DATA).map(s => `
        <button class="sec-btn ${s.id === app.secId ? "active" : ""}" onclick="selectSection('${s.id}')">
          ${s.title}
        </button>
      `).join("");

      // 2. Task Bar
      const taskBar = document.getElementById("taskBar");
      taskBar.innerHTML = sec.tasks.map(t => `
        <div class="task-pill ${t.id === app.taskId ? "active" : ""}" onclick="selectTask('${t.id}')">
          <span class="task-pill-num">${t.num}</span>
          <span class="task-pill-title">${t.title}</span>
        </div>
      `).join("");

      // 3. Condition
      const condText = document.getElementById("condText");
      condText.innerHTML = task.cond;
      renderMathIn(condText);

      // 4. Step Tabs
      const stepTabs = document.getElementById("stepTabs");
      stepTabs.innerHTML = task.steps.map((st, idx) => `
        <button class="step-tab ${idx === app.stepIdx ? "active" : (idx < app.stepIdx ? "done" : "")}" onclick="selectStep(${idx})">
          ${st.tab}
        </button>
      `).join("");

      // 5. Active Step Content
      document.getElementById("stepBadge").textContent = `ШАГ ${app.stepIdx + 1} ИЗ ${task.steps.length}`;
      document.getElementById("stepTitle").innerHTML = step.title;
      document.getElementById("stepTryText").innerHTML = step.try;
      const expEl = document.getElementById("stepExplain");
      expEl.innerHTML = step.explain;
      renderMathIn(expEl);
      const ahaEl = document.getElementById("stepAha");
      ahaEl.innerHTML = step.aha;
      renderMathIn(ahaEl);

      // 6. Prev / Next buttons
      const btnPrev = document.getElementById("btnPrev");
      const btnNext = document.getElementById("btnNext");
      btnPrev.disabled = app.stepIdx === 0;
      if (app.stepIdx < task.steps.length - 1) {
        btnNext.textContent = `Дальше: ${task.steps[app.stepIdx + 1].tab} →`;
      } else {
        btnNext.textContent = "🎉 В начало задачи ↺";
      }

      renderCustomStepControls();
      updateChipsAndActions();
    }

    window.selectSection = function(secId) {
      app.secId = secId;
      app.taskId = DATA[secId].tasks[0].id;
      app.stepIdx = 0;
      initTaskDefaults();
      syncUI();

      initTaskDefaults();
      syncUI();

    function renderCustomStepControls() {
      const box = document.getElementById("stepCustomControls");

      if (app.taskId === "knights") {
        const pct = Math.round(app.unfoldT * 100);
        html = `
          <div class="ctrl-box">
            <div class="ctrl-row">
              <span>Трансформация: Звезда → Круг</span>
              <span class="ctrl-val">${pct}%</span>
            </div>
            <input type="range" min="0" max="100" value="${pct}" oninput="app.unfoldT = this.value/100; renderCustomStepControls();" />
          </div>
        `;
      } else if (app.taskId === "a_mod" || app.taskId === "a_pencil" || app.taskId === "a_circle") {
        const minA = app.taskId === "a_mod" ? -1 : (app.taskId === "a_pencil" ? -2.2 : -4.0);
        const maxA = app.taskId === "a_mod" ? 5 : (app.taskId === "a_pencil" ? 2.5 : 5.5);
        html = `
          <div class="ctrl-box">
            <div class="ctrl-row">
