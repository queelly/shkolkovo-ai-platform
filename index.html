              <span>Угол поворота △AMB вокруг точки M</span>
              <span class="ctrl-val">${deg}°</span>
            </div>
            <input type="range" min="0" max="180" value="${deg}" oninput="app.geomRot = this.value/180; renderCustomStepControls(); updateChipsAndActions();" />
          </div>
        `;
      }

      box.innerHTML = html;
    }

    function updateChipsAndActions() {
      const chipsEl = document.getElementById("statusChips");
      const actEl = document.getElementById("stageActions");
      if (!chipsEl || !actEl) return;

      let chips = "";
      let acts = "";

      if (app.taskId === "knights") {
        const order = app.knights.filter(Boolean).map(k => k === "W" ? "Б" : "Ч").join(" → ");
        chips = `
          <span class="chip blue">Ходов сделано: ${app.knightMovesCount}</span>
          <span class="chip green">Порядок по кругу: ${order} (неизменен!)</span>
        `;
        acts = `
          <button class="action-btn primary" onclick="tweenProp(app, 'unfoldT', app.unfoldT > 0.5 ? 0 : 1, 750, renderCustomStepControls)">
            ${app.unfoldT > 0.5 ? "♟️ Свернуть обратно в звезду" : "✨ Развернуть звезду в круг"}
          </button>
          <button class="action-btn" onclick="initTaskDefaults(); updateChipsAndActions();">↺ Сбросить коней</button>
        `;
      } else if (app.taskId === "k33") {
        const cr = getK33Crossings().length;
        const total = app.k33Edges.length;
        chips = `
          <span class="chip blue">Тропинок проведено: ${total} / 9</span>
          <span class="chip ${cr === 0 ? "green" : "red"}">Пересечений: ${cr}</span>
        `;
        acts = `
          <button class="action-btn ${app.stepIdx === 1 ? "primary" : ""}" onclick="resetK33Layout(1); updateChipsAndActions();">Показать 6 тропинок контура</button>
          <button class="action-btn ${app.stepIdx >= 3 ? "primary" : ""}" onclick="resetK33Layout(3); updateChipsAndActions();">Провести все 9 тропинок</button>
          <button class="action-btn" onclick="resetK33Layout(0); updateChipsAndActions();">↺ Своя укладка</button>
        `;
      } else if (app.taskId === "trees") {
        const V = app.treeNodes.filter(n => n.alive).length;
        const E = app.treeEdges.filter(e => e.alive).length;
        chips = `
          <span class="chip blue">Вершин V = ${V}</span>
          <span class="chip blue">Рёбер E = ${E}</span>
          <span class="chip green">Инвариант V − E = ${V - E}</span>
        `;
        acts = `
          <button class="action-btn primary" onclick="runTreeWalkerAnim()">🚶 Запустить путника до листа</button>
          <button class="action-btn" onclick="autoPruneAllLeaves()">✂️ Срезать все листья</button>
          <button class="action-btn" onclick="resetTreeLayout(); updateChipsAndActions();">↺ Восстановить дерево</button>
        `;
      } else if (app.taskId === "king") {
        const k = app.kingSelected;
        const s1 = new Set();
        app.tourEdges.forEach(e => { if (e.u === k) s1.add(e.v); });
        const s2 = new Set();
        app.tourEdges.forEach(e => { if (s1.has(e.u) && e.v !== k && !s1.has(e.v)) s2.add(e.v); });
        const cov = 1 + s1.size + s2.size;
        chips = `
          <span class="chip blue">Проверка: Команда ${k} (${s1.size} поб.)</span>
          <span class="chip ${cov === 6 ? "green" : "red"}">Охват за ≤2 шага: ${cov} / 6 команд ${cov === 6 ? "👑 КОРОЛЬ!" : ""}</span>
        `;
        acts = `
          <button class="action-btn primary" onclick="triggerKingLaser(1)">👑 Выбрать Лидера (Ком. 1)</button>
          <button class="action-btn" onclick="triggerKingLaser(6)">Проверить Ком. 6</button>
          <button class="action-btn" onclick="resetTournamentLayout()">↺ Сброс турнира</button>
        `;
      } else if (app.taskId === "a_mod") {
        const a = app.algA;
        const roots = Math.abs(a) < 0.04 ? 2 : (Math.abs(a - 3) < 0.04 ? 3 : (a < 0 ? 0 : (a < 3 ? 4 : 2)));
        chips = `
          <span class="chip blue">Параметр a = ${a.toFixed(2)}</span>
          <span class="chip ${roots === 3 ? "green" : "amber"}">Число корней: ${roots} ${roots === 3 ? "🎯 ПОЙМАНО!" : ""}</span>
        `;
        acts = `
          <button class="action-btn" onclick="tweenProp(app,'algA',0,450,()=>{renderCustomStepControls();updateChipsAndActions();})">a = 0 (2 к.)</button>
          <button class="action-btn" onclick="tweenProp(app,'algA',1.5,450,()=>{renderCustomStepControls();updateChipsAndActions();})">a = 1.5 (4 к.)</button>
          <button class="action-btn primary" onclick="tweenProp(app,'algA',3.0,450,()=>{renderCustomStepControls();updateChipsAndActions();})">🎯 a = 3 (3 корня!)</button>
        `;
      } else if (app.taskId === "a_pencil") {
        const a = app.algA;
        const ok = a > -0.6 && a < 1.0;
        const tang = Math.abs(a + 0.6) < 0.03 || Math.abs(a - 1.0) < 0.03;
        const roots = ok ? 2 : (tang ? 1 : 0);
        chips = `
          <span class="chip blue">Наклон a = ${a.toFixed(2)}</span>
          <span class="chip ${roots === 2 ? "green" : (roots === 1 ? "amber" : "red")}">Решений: ${roots} ${roots === 2 ? "✓ В секторе (−0.6; 1)" : ""}</span>
        `;
        acts = `
          <button class="action-btn" onclick="tweenProp(app,'algA',-0.6,500,()=>{renderCustomStepControls();updateChipsAndActions();})">Верх: a = −0.6</button>
          <button class="action-btn primary" onclick="tweenProp(app,'algA',0.2,500,()=>{renderCustomStepControls();updateChipsAndActions();})">Внутри: a = 0.2 (2 реш.)</button>
          <button class="action-btn" onclick="tweenProp(app,'algA',1.0,500,()=>{renderCustomStepControls();updateChipsAndActions();})">Низ: a = 1.0</button>
        `;
      } else if (app.taskId === "a_circle") {
        const a = app.algA;
        const s2 = 3 * Math.SQRT2;
        let roots = 0;
        if (Math.abs(a + 3) < 0.05) roots = 1;
        else if (Math.abs(a - 3) < 0.05) roots = 3;
        else if (Math.abs(a - s2) < 0.05) roots = 2;
        else if (a > -3 && a < 3) roots = 2;
        else if (a > 3 && a < s2) roots = 4;
        chips = `
          <span class="chip blue">Центр (0; ${a.toFixed(2)})</span>
          <span class="chip ${roots === 3 ? "green" : "amber"}">Решений: ${roots} ${roots === 3 ? "🎯 Остриё в (0;0)!" : ""}</span>
        `;
        acts = `
          <button class="action-btn" onclick="tweenProp(app,'algA',-3,500,()=>{renderCustomStepControls();updateChipsAndActions();})">a = −3 (1 реш.)</button>
          <button class="action-btn primary" onclick="tweenProp(app,'algA',3,500,()=>{renderCustomStepControls();updateChipsAndActions();})">🎯 a = 3 (3 реш.)</button>
          <button class="action-btn" onclick="tweenProp(app,'algA',3*Math.SQRT2,500,()=>{renderCustomStepControls();updateChipsAndActions();})">a = 3√2 (Касание)</button>
        `;
      } else if (app.taskId === "l_ring") {
        const negs = app.ringVals.filter(v => v < 0).length;
        let allPos = true;
        for (let i = 0; i < 13; i++) {
          const s4 = app.ringVals[i] + app.ringVals[(i+1)%13] + app.ringVals[(i+2)%13] + app.ringVals[(i+3)%13];
          if (s4 <= 0) allPos = false;
        }
        chips = `
          <span class="chip blue">Отрицательных: ${negs} из 13</span>
          <span class="chip ${allPos && negs === 9 ? "green" : (allPos ? "amber" : "red")}">
            ${allPos ? (negs === 9 ? "✓ Рекорд 9 минусов достигнут!" : "✓ Все четвёрки > 0") : "✗ Ошибка: есть четвёрка ≤ 0!"}
          </span>
        `;
        acts = `
          <button class="action-btn ${app.ringArcMode === 'weak' ? 'primary' : ''}" onclick="app.ringArcMode='weak'; updateChipsAndActions();">3 дуги (Слабая ≤ 10)</button>
          <button class="action-btn ${app.ringArcMode === 'exact' ? 'primary' : ''}" onclick="app.ringArcMode='exact'; updateChipsAndActions();">🎯 Якорь + 3 дуги (Точная ≤ 9)</button>
          <button class="action-btn" onclick="app.ringVals=[10,-1,-1,-1,10,-1,-1,-1,10,-1,-1,-1,10]; updateChipsAndActions();">Пример на 9 минусов</button>
        `;
      } else if (app.taskId === "l_inv") {
        const sum = app.invNums[0] + app.invNums[1] + app.invNums[2];
        const evens = app.invNums.filter(n => n % 2 === 0).length;
        chips = `
          <span class="chip blue">Сумма: ${sum} (всегда 2325)</span>
          <span class="chip green">Чётных чисел на доске: ${evens} (всегда ≥ 1)</span>
        `;
        acts = `
          <button class="action-btn primary" onclick="doRandomInvMove()">⚡ Сделать случайный ход (x−y, 2y)</button>
          <button class="action-btn" onclick="initTaskDefaults(); updateChipsAndActions();">↺ Сбросить (100, 200, 2025)</button>
        `;
      } else if (app.taskId === "l_game") {
        chips = `
          <span class="chip blue">Полоска 1 × ${app.gameN}</span>
          <span class="chip ${app.gamePos === app.gameN ? 'green' : 'amber'}">Фишка на клетке: ${app.gamePos} / ${app.gameN}</span>
        `;
        acts = `
          <button class="action-btn ${app.gameShowTraps ? 'primary' : ''}" onclick="app.gameShowTraps=!app.gameShowTraps; updateChipsAndActions();">
            ${app.gameShowTraps ? "🔍 Рентген ловушек: ВКЛ" : "🔍 Включить рентген ловушек"}
          </button>
          <button class="action-btn" onclick="app.gameN = (app.gameN === 17 ? 18 : 17); app.gamePos = 1; app.gameLastAiArch = null; updateChipsAndActions();">
            Полоска: ${app.gameN === 17 ? "Переключить на 18 клеток" : "Вернуть 17 клеток"}
          </button>
          <button class="action-btn" onclick="app.gamePos=1; app.gameLastAiArch=null; updateChipsAndActions();">↺ Заново</button>
        `;
      } else if (app.taskId === "c_stars") {
        const formula = app.comboEmpty ? "C(13, 3) = 286 способов" : "C(9, 3) = 84 способа";
        chips = `
          <span class="chip blue">Разбиение: ${app.comboCounts.join(" + ")} = 10</span>
          <span class="chip green">${formula}</span>
        `;
        acts = `
          <button class="action-btn ${!app.comboEmpty ? 'primary' : ''}" onclick="app.comboEmpty=false; app.comboCounts=[3,2,3,2]; updateChipsAndActions();">Режим А: Без пустых (xᵢ ≥ 1)</button>
          <button class="action-btn ${app.comboEmpty ? 'primary' : ''}" onclick="app.comboEmpty=true; app.comboCounts=[4,0,4,2]; updateChipsAndActions();">Режим Б: С пустыми (xᵢ ≥ 0)</button>
        `;
      } else if (app.taskId === "c_pairs") {
        const div1 = app.pairGlueIn ? 8 : 1;
        const div2 = app.pairGlueTab ? 6 : 1;
        const res = 720 / (div1 * div2);
        chips = `
          <span class="chip blue">Формула: 720 ÷ ${div1} ÷ ${div2}</span>
          <span class="chip green">Итого: ${res} ${res === 15 ? "способов ✓" : "вариантов"}</span>
        `;
        acts = `
          <button class="action-btn ${app.pairGlueIn ? 'primary' : ''}" onclick="app.pairGlueIn=!app.pairGlueIn; updateChipsAndActions();">Рубильник 1: Внутри пар (÷ 2³)</button>
          <button class="action-btn ${app.pairGlueTab ? 'primary' : ''}" onclick="app.pairGlueTab=!app.pairGlueTab; updateChipsAndActions();">Рубильник 2: Номера столов (÷ 3!)</button>
          <button class="action-btn" onclick="app.pairPlayers.push(app.pairPlayers.shift()); updateChipsAndActions();">🔄 Переставить столы</button>
        `;
      } else if (app.taskId === "m_median") {
        const done = app.geomRot > 0.96;
        chips = `
          <span class="chip blue">Поворот вокруг M: ${Math.round(app.geomRot * 180)}°</span>
          <span class="chip ${done ? 'green' : 'amber'}">${done ? "✓ Параллелограмм ABCD собран (2·BM < AB + BC)" : "Потяни ползунок или нажми кнопку разворота"}</span>
        `;
        acts = `
          <button class="action-btn primary" onclick="tweenProp(app, 'geomRot', app.geomRot > 0.5 ? 0 : 1, 750, ()=>{renderCustomStepControls();updateChipsAndActions();})">
            ${app.geomRot > 0.5 ? "↺ Вернуть треугольник" : "✨ Развернуть медиану на 180°"}
          </button>
        `;
      } else if (app.taskId === "m_circle") {
        const angB = angleDeg(app.cirA, app.cirB, app.cirD);
        const angC = angleDeg(app.cirA, app.cirC, app.cirD);
        const onCirc = Math.abs(angB - angC) < 1.5;
        chips = `
          <span class="chip blue">∠ABD = ${angB.toFixed(1)}° | ∠ACD = ${angC.toFixed(1)}°</span>
          <span class="chip ${onCirc ? 'green' : 'amber'}">${onCirc ? "🎯 Точка C на окружности! Углы равны!" : "Подведи точку C к окружности!"}</span>
        `;
        acts = `
          <button class="action-btn primary" onclick="snapCToCircle()">🧲 Притянуть точку C на окружность</button>
        `;
      }

      chipsEl.innerHTML = chips;
      actEl.innerHTML = acts;
    }

    window.doRandomInvMove = function() {
      const i = Math.floor(Math.random() * 3);
      const j = (i + 1 + Math.floor(Math.random() * 2)) % 3;
      const x = app.invNums[i], y = app.invNums[j];
      app.invNums[i] = x - y;
      app.invNums[j] = 2 * y;
      app.invLastDoubleIdx = j;
      app.invMoves++;
      updateChipsAndActions();
    };

    // =========================================================================
    // 6. DIRECT CANVAS POINTER INTERACTIVITY (ALL 12 TASKS PLAYABLE!)
    // =========================================================================
    function getKnightsBoardAndCircleGeom() {
      const cell = Math.min(82, W * 0.105);
      const bx = W * 0.23 - (cell * 1.5);
      const by = H * 0.52 - (cell * 1.5);
      const cx = W * 0.73;
      const cy = H * 0.52;
      const R = Math.min(132, W * 0.16);
      const nodes = CYCLE_CELLS.map((c, idx) => {
        const xBoard = bx + (c.c + 0.5) * cell;
        const yBoard = by + (c.r + 0.5) * cell;
        const ang = (idx * 2 * Math.PI) / 8 - Math.PI / 2;
        const xCirc = cx + R * Math.cos(ang);
        const yCirc = cy + R * Math.sin(ang);
        const t = app.unfoldT;
        return {
          idx,
          code: c.code,
          r: c.r,
          c: c.c,
          xBoard,
          yBoard,
          xRight: xBoard + (xCirc - xBoard) * t,
          yRight: yBoard + (yCirc - yBoard) * t
        };
      });
      return { cell, bx, by, cx, cy, R, nodes };
    }

    function getAlgTransform() {
      const ox = W * 0.5;
      const oy = H * 0.58;
      const sc = Math.min(W, H) / 12.5;
      return {
        ox, oy, sc,
        toX: x => ox + x * sc,
        toY: y => oy - y * sc,
        fromX: px => (px - ox) / sc,
        fromY: py => (oy - py) / sc
      };
    }

    function getPointerPos(e) {
      const rect = canvas.getBoundingClientRect();
      return { x: e.clientX - rect.left, y: e.clientY - rect.top };
    }

    canvas.addEventListener("pointerdown", e => {
      const p = getPointerPos(e);

      // 1. KNIGHTS ON 3x3
      if (app.taskId === "knights") {
        const g = getKnightsBoardAndCircleGeom();
        for (const nd of g.nodes) {
          const hitBoard = Math.hypot(p.x - nd.xBoard, p.y - nd.yBoard) < g.cell * 0.45;
          const hitRight = Math.hypot(p.x - nd.xRight, p.y - nd.yRight) < 28;
          if (hitBoard || hitRight) {
            if (app.knights[nd.idx]) {
              app.selectedKnightIdx = nd.idx;
              spawnRing(nd.xBoard, nd.yBoard, "#0085FF", 42);
              spawnRing(nd.xRight, nd.yRight, "#0085FF", 42);
            } else if (app.selectedKnightIdx !== null) {
              const diff = Math.abs(nd.idx - app.selectedKnightIdx);
              if (diff === 1 || diff === 7) {
                const from = g.nodes[app.selectedKnightIdx];
                const kColor = app.knights[app.selectedKnightIdx];
                app.knights[nd.idx] = kColor;
                app.knights[app.selectedKnightIdx] = null;
                app.selectedKnightIdx = nd.idx;
                app.knightMovesCount++;
                spawnParticle(from.xBoard, from.yBoard, nd.xBoard, nd.yBoard, "#10B981", 280);
                spawnParticle(from.xRight, from.yRight, nd.xRight, nd.yRight, "#10B981", 280);
                spawnRing(nd.xRight, nd.yRight, "#10B981", 46);
                updateChipsAndActions();
              }
            }
            return;
          }
        }
      }

      // 2. K3,3 HOUSES & WELLS
      else if (app.taskId === "k33") {
        for (const nd of app.k33Nodes) {
          if (Math.hypot(p.x - nd.x, p.y - nd.y) < 30) {
            app.k33DragNode = nd;
            if (app.k33SelectedNode === null) {
              app.k33SelectedNode = nd.id;
              spawnRing(nd.x, nd.y, "#0085FF", 45);
            } else if (app.k33SelectedNode === nd.id) {
              app.k33SelectedNode = null;
            } else {
              const uNode = app.k33Nodes.find(n => n.id === app.k33SelectedNode);
              if (uNode && uNode.type !== nd.type) {
                const u = uNode.id, v = nd.id;
                const exIdx = app.k33Edges.findIndex(([a, b]) => (a === u && b === v) || (a === v && b === u));
                if (exIdx >= 0) {
                  app.k33Edges.splice(exIdx, 1);
                  spawnRing(nd.x, nd.y, "#EF4444", 42);
                } else {
                  app.k33Edges.push([u, v]);
                  spawnParticle(uNode.x, uNode.y, nd.x, nd.y, "#10B981", 320);
                }
                app.k33SelectedNode = null;
                updateChipsAndActions();
              } else {
                app.k33SelectedNode = nd.id;
                spawnRing(nd.x, nd.y, "#0085FF", 45);
              }
            }
            return;
          }
        }
        // Check click near edge midpoint to toggle edge
        for (let i = 0; i < app.k33Edges.length; i++) {
          const [u, v] = app.k33Edges[i];
          const n1 = app.k33Nodes.find(n => n.id === u);
          const n2 = app.k33Nodes.find(n => n.id === v);
          if (n1 && n2) {
            const mx = (n1.x + n2.x) / 2, my = (n1.y + n2.y) / 2;
            if (Math.hypot(p.x - mx, p.y - my) < 18) {
              app.k33Edges.splice(i, 1);
              spawnRing(mx, my, "#EF4444", 38);
              updateChipsAndActions();
              return;
            }
          }
        }
        app.k33SelectedNode = null;
      }

      // 3. TREES LEAF SLICER
      else if (app.taskId === "trees") {
        const deg = getTreeDegrees();
        for (const nd of app.treeNodes) {
          if (!nd.alive) continue;
          if (Math.hypot(p.x - nd.x, p.y - nd.y) < 30) {
            const d = deg[nd.id] || 0;
            if (d === 1) {
              const edge = app.treeEdges.find(ed => ed.alive && (ed.u === nd.id || ed.v === nd.id));
              const prId = edge ? (edge.u === nd.id ? edge.v : edge.u) : null;
              const pr = app.treeNodes.find(n => n.id === prId);
              nd.alive = false;
              if (edge) edge.alive = false;
              spawnRing(nd.x, nd.y, "#10B981", 52);
              if (pr) spawnParticle(nd.x, nd.y, pr.x, pr.y, "#10B981", 340);
              const aliveCount = app.treeNodes.filter(n => n.alive).length;
              app.treeMsg = aliveCount === 1
                ? "🎉 Победа! Остался 1 корень и 0 рёбер (V − E = 1 − 0 = 1). Теорема доказана!"
                : `✂️ Срезан ${nd.label}: ушли ровно 1 вершина и 1 ребро! Разность V − E = 1 сохранилась!`;
              app.treeMsgType = "ok";
              updateChipsAndActions();
            } else if (d >= 2) {
              spawnRing(nd.x, nd.y, "#EF4444", 58);
              app.treeMsg = `⚠️ Осторожно! у «${nd.label}» степень ${d} — если удалить развилку, дерево распадётся на куски! Ищи зелёный лист (степень 1)!`;
              app.treeMsgType = "err";
            } else {
              spawnRing(nd.x, nd.y, "#10B981", 50);
              app.treeMsg = "🌟 Это последняя оставшаяся вершина (V = 1, E = 0)!";
              app.treeMsgType = "ok";
            }
            return;
          }
        }
      }

      // 4. TOURNAMENT KING
      else if (app.taskId === "king") {
        for (const nd of app.tourNodes) {
          if (Math.hypot(p.x - nd.x, p.y - nd.y) < 32) {
            triggerKingLaser(nd.id);
            return;
          }
        }
        // Check click on edge midpoint to flip match outcome!
        for (const ed of app.tourEdges) {
          const u = app.tourNodes.find(n => n.id === ed.u);
          const v = app.tourNodes.find(n => n.id === ed.v);
          if (u && v) {
            const mx = (u.x + v.x) / 2, my = (u.y + v.y) / 2;
            if (Math.hypot(p.x - mx, p.y - my) < 16) {
              const tmp = ed.u; ed.u = ed.v; ed.v = tmp;
              spawnRing(mx, my, "#F59E0B", 38);
              triggerKingLaser(app.kingSelected);
              return;
            }
          }
        }
      }

      // 5. ALGEBRA & PARAMETERS
      else if (app.taskId === "a_mod" || app.taskId === "a_pencil" || app.taskId === "a_circle") {
        app.algDrag = true;
        handleAlgPointer(p);
      }

      // 6. LOGIC RING (13 NUMBERS)
      else if (app.taskId === "l_ring") {
        const cx = W * 0.5, cy = H * 0.52, R = Math.min(W, H) * 0.34;
        for (let i = 0; i < 13; i++) {
          const ang = (i * 2 * Math.PI) / 13 - Math.PI / 2;
          const nx = cx + R * Math.cos(ang), ny = cy + R * Math.sin(ang);
          if (Math.hypot(p.x - nx, p.y - ny) < 26) {
            app.ringVals[i] = app.ringVals[i] > 0 ? -1 : 10;
            spawnRing(nx, ny, app.ringVals[i] > 0 ? "#0085FF" : "#EF4444", 42);
            updateChipsAndActions();
            return;
          }
        }
      }

      // 7. LOGIC INVARIANT CARDS
      else if (app.taskId === "l_inv") {
        const cw = 165, ch = 125, gap = 36;
        const startX = (W - (3 * cw + 2 * gap)) / 2;
        const cy = H * 0.45 - ch / 2;
        for (let i = 0; i < 3; i++) {
          const rx = startX + i * (cw + gap);
          if (p.x >= rx && p.x <= rx + cw && p.y >= cy && p.y <= cy + ch) {
            if (app.invSelectedCard === null) {
              app.invSelectedCard = i;
              spawnRing(rx + cw / 2, cy + ch / 2, "#0085FF", 58);
            } else if (app.invSelectedCard === i) {
              app.invSelectedCard = null;
            } else {
              const idxX = app.invSelectedCard, idxY = i;
              const x = app.invNums[idxX], y = app.invNums[idxY];
              app.invNums[idxX] = x - y;
              app.invNums[idxY] = 2 * y;
              app.invLastDoubleIdx = idxY;
              app.invSelectedCard = null;
              app.invMoves++;
              spawnRing(rx + cw / 2, cy + ch / 2, "#10B981", 65);
              updateChipsAndActions();
            }
            return;
          }
        }
      }

      // 8. LOGIC SYMMETRY / BACKWARD GAME 1xN
      else if (app.taskId === "l_game") {
        const N = app.gameN;
        const pad = 42;
        const cellW = Math.min(44, (W - 2 * pad) / N);
        const startX = (W - N * cellW) / 2;
        const cy = H * 0.5;
        for (let k = 1; k <= N; k++) {
          const rx = startX + (k - 1) * cellW;
          if (p.x >= rx && p.x <= rx + cellW && Math.abs(p.y - cy) < 38) {
            const step = k - app.gamePos;
            if (step >= 1 && step <= 3 && app.gamePos < N) {
              const prevPos = app.gamePos;
              app.gamePos = k;
              spawnRing(rx + cellW / 2, cy, "#10B981", 44);
              if (app.gamePos === N) {
                app.gameStatusText = "🏆 БРАВО! Ты встал на последнюю клетку и выиграл партию!";
                app.gameLastAiArch = null;
                updateChipsAndActions();
              } else {
                app.gameStatusText = `Твой ход: +${step} (на клетку ${k}). Компьютер думает...`;
                updateChipsAndActions();
                later(420, () => {
                  if (app.gamePos >= app.gameN) return;
                  const rem = (app.gameN - app.gamePos) % 4;
                  const aiStep = rem === 0 ? 1 : rem;
                  const fromK = app.gamePos;
                  const toK = Math.min(app.gameN, fromK + aiStep);
                  app.gamePos = toK;
                  app.gameLastAiArch = { from: fromK, to: toK, step: toK - fromK, userStep: step };
                  app.gameStatusText = toK === app.gameN
                    ? `Компьютер ответил +${toK - fromK} (дополнение 4 − ${step}) и занял финишную клетку ${app.gameN}!`
                    : `Компьютер ответил +${toK - fromK} и встал на клетку ${toK}. Твой ход!`;
                  updateChipsAndActions();
                });
              }
            }
            return;
          }
        }
      }

      // 9. COMBINATORICS: STARS & BARS
      else if (app.taskId === "c_stars") {
        const bars = getComboBarPositions();
        for (let b = 0; b < 3; b++) {
          if (Math.hypot(p.x - bars[b].x, p.y - bars[b].y) < 32) {
            app.draggingBarIdx = b;
            return;
          }
        }
      }

      // 10. COMBINATORICS: PAIRS / CHESS TABLES
      else if (app.taskId === "c_pairs") {
        const tw = 175, th = 120, gap = 42;
        const startX = (W - (3 * tw + 2 * gap)) / 2;
        const cy = H * 0.48 - th / 2;
        for (let i = 0; i < 3; i++) {
          const rx = startX + i * (tw + gap);
          if (p.x >= rx && p.x <= rx + tw && p.y >= cy && p.y <= cy + th) {
            app.pairPlayers[i].reverse();
            spawnRing(rx + tw / 2, cy + th / 2, "#0085FF", 58);
            return;
          }
        }
      }

      // 11. PLANIMETRY: MEDIAN DOUBLING & AUXILIARY CIRCLE
      else if (app.taskId === "m_median") {
        for (const key of ["geomA", "geomB", "geomC"]) {
          if (Math.hypot(p.x - app[key].x, p.y - app[key].y) < 28) {
            app.draggingGeom = key;
            return;
          }
        }
      } else if (app.taskId === "m_circle") {
        for (const key of ["cirC", "cirA", "cirB", "cirD"]) {
          if (Math.hypot(p.x - app[key].x, p.y - app[key].y) < 28) {
            app.draggingGeom = key;
            return;
          }
        }
      }
    });

    canvas.addEventListener("pointermove", e => {
      const p = getPointerPos(e);

      if (app.taskId === "k33" && app.k33DragNode) {
        app.k33DragNode.x = Math.max(45, Math.min(W - 45, p.x));
        app.k33DragNode.y = Math.max(45, Math.min(H - 45, p.y));
        updateChipsAndActions();
      } else if ((app.taskId === "a_mod" || app.taskId === "a_pencil" || app.taskId === "a_circle") && app.algDrag) {
        handleAlgPointer(p);
      } else if (app.taskId === "l_ring") {
        const cx = W * 0.5, cy = H * 0.52, R = Math.min(W, H) * 0.34;
        for (let i = 0; i < 13; i++) {
          const ang = (i * 2 * Math.PI) / 13 - Math.PI / 2;
          const nx = cx + R * Math.cos(ang), ny = cy + R * Math.sin(ang);
          if (Math.hypot(p.x - nx, p.y - ny) < 32) {
            app.ringHoverIdx = i;
            break;
          }
        }
      } else if (app.taskId === "c_stars" && app.draggingBarIdx >= 0) {
        handleComboBarDrag(p);
      } else if ((app.taskId === "m_median" || app.taskId === "m_circle") && app.draggingGeom) {
        app[app.draggingGeom].x = Math.max(50, Math.min(W - 50, p.x));
        app[app.draggingGeom].y = Math.max(50, Math.min(H - 50, p.y));
        updateChipsAndActions();
      }
    });

    window.addEventListener("pointerup", () => {
      app.k33DragNode = null;
      app.algDrag = false;
      app.draggingBarIdx = -1;
      app.draggingGeom = null;
    });

    function handleAlgPointer(p) {
      const tr = getAlgTransform();
      const x = tr.fromX(p.x);
      const y = tr.fromY(p.y);
      if (app.taskId === "a_mod") {
        let val = Math.max(-1, Math.min(5, y));
        if (Math.abs(val - 3) < 0.14) val = 3;
        if (Math.abs(val) < 0.14) val = 0;
        app.algA = val;
      } else if (app.taskId === "a_pencil") {
        if (Math.abs(x - 5) > 0.25) {
          let slope = (y - 1) / (x - 5);
          slope = Math.max(-2.2, Math.min(2.5, slope));
          if (Math.abs(slope + 0.6) < 0.08) slope = -0.6;
          if (Math.abs(slope - 1.0) < 0.08) slope = 1.0;
          app.algA = slope;
        }
      } else if (app.taskId === "a_circle") {
        let val = Math.max(-4, Math.min(5.5, y));
        if (Math.abs(val - 3) < 0.15) val = 3;
        if (Math.abs(val + 3) < 0.15) val = -3;
        if (Math.abs(val - 3 * Math.SQRT2) < 0.15) val = 3 * Math.SQRT2;
        app.algA = val;
      }
      renderCustomStepControls();
      updateChipsAndActions();
    }

    function getComboBarPositions() {
      const cy = H * 0.36;
      if (!app.comboEmpty) {
        const span = Math.min(620, W - 140);
        const startX = (W - span) / 2;
        const step = span / 9;
        const b1 = app.comboCounts[0];
        const b2 = b1 + app.comboCounts[1];
        const b3 = b2 + app.comboCounts[2];
        return [
          { x: startX + (b1 - 0.5) * step, y: cy, slot: b1 },
          { x: startX + (b2 - 0.5) * step, y: cy, slot: b2 },
          { x: startX + (b3 - 0.5) * step, y: cy, slot: b3 }
        ];
      } else {
        const span = Math.min(660, W - 120);
        const startX = (W - span) / 2;
        const step = span / 12;
        const s1 = app.comboCounts[0];
        const s2 = s1 + 1 + app.comboCounts[1];
        const s3 = s2 + 1 + app.comboCounts[2];
        return [
          { x: startX + s1 * step, y: cy, slot: s1 },
          { x: startX + s2 * step, y: cy, slot: s2 },
          { x: startX + s3 * step, y: cy, slot: s3 }
        ];
      }
    }

    function handleComboBarDrag(p) {
      const idx = app.draggingBarIdx;
      if (!app.comboEmpty) {
        const span = Math.min(620, W - 140);
        const startX = (W - span) / 2;
        const step = span / 9;
        let b1 = app.comboCounts[0];
        let b2 = b1 + app.comboCounts[1];
        let b3 = b2 + app.comboCounts[2];
        const rawSlot = Math.round((p.x - startX) / step + 0.5);
        if (idx === 0) b1 = Math.max(1, Math.min(b2 - 1, rawSlot));
        if (idx === 1) b2 = Math.max(b1 + 1, Math.min(b3 - 1, rawSlot));
        if (idx === 2) b3 = Math.max(b2 + 1, Math.min(9, rawSlot));
        app.comboCounts = [b1, b2 - b1, b3 - b2, 10 - b3];
      } else {
        const span = Math.min(660, W - 120);
        const startX = (W - span) / 2;
        const step = span / 12;
        let s1 = app.comboCounts[0];
        let s2 = s1 + 1 + app.comboCounts[1];
        let s3 = s2 + 1 + app.comboCounts[2];
        const rawSlot = Math.round((p.x - startX) / step);
        if (idx === 0) s1 = Math.max(0, Math.min(s2 - 1, rawSlot));
        if (idx === 1) s2 = Math.max(s1 + 1, Math.min(s3 - 1, rawSlot));
        if (idx === 2) s3 = Math.max(s2 + 1, Math.min(12, rawSlot));
        app.comboCounts = [s1, s2 - s1 - 1, s3 - s2 - 1, 12 - s3];
      }
      updateChipsAndActions();
    }

    // =========================================================================
    // 7. 60-FPS INTERACTIVE CANVAS RENDERER
    // =========================================================================
    function isDark() { return document.body.getAttribute("data-theme") === "dark"; }

    function drawRoundRect(x, y, w, h, r, fill, stroke, lineW = 1.5) {
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, r);
      if (fill) { ctx.fillStyle = fill; ctx.fill(); }
      if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lineW; ctx.stroke(); }
    }

    function drawArrow(x1, y1, x2, y2, rNode, color, width = 2.2) {
      const ang = Math.atan2(y2 - y1, x2 - x1);
      const sx = x1 + rNode * Math.cos(ang);
      const sy = y1 + rNode * Math.sin(ang);
      const ex = x2 - (rNode + 4) * Math.cos(ang);
      const ey = y2 - (rNode + 4) * Math.sin(ang);
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(ex, ey);
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.stroke();

      const head = 9 + width;
      ctx.beginPath();
      ctx.moveTo(ex, ey);
      ctx.lineTo(ex - head * Math.cos(ang - 0.42), ey - head * Math.sin(ang - 0.42));
      ctx.lineTo(ex - head * Math.cos(ang + 0.42), ey - head * Math.sin(ang + 0.42));
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
    }

    // ---- SCENE 1: KNIGHTS ON 3x3 BOARD & UNFOLDED CIRCLE ----
    function renderKnights() {
      const g = getKnightsBoardAndCircleGeom();
      const dark = isDark();

      // Titles
      ctx.font = "800 15px Nunito, sans-serif";
      ctx.fillStyle = dark ? "#E2E8F0" : "#0B192C";
      ctx.textAlign = "center";
      ctx.fillText("1. Шахматная доска 3 × 3 (кликай на коней!)", g.bx + g.cell * 1.5, g.by - 24);
      ctx.fillText(
        app.unfoldT > 0.5 ? "2. Те же 8 клеток, развёрнутые в круг!" : "2. Граф ходов коня (потяни ползунок разворота)",
        g.cx, g.cy - g.R - 36
      );

      // Draw 3x3 Board
      const cols = ["a", "b", "c"];
      for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 3; c++) {
          const x = g.bx + c * g.cell;
          const y = g.by + r * g.cell;
          const light = (r + c) % 2 === 0;
          ctx.fillStyle = light ? (dark ? "#1E293B" : "#F1F5F9") : (dark ? "#334155" : "#CBD5E1");
          ctx.fillRect(x, y, g.cell, g.cell);
          ctx.strokeStyle = dark ? "#475569" : "#94A3B8";
          ctx.lineWidth = 1;
          ctx.strokeRect(x, y, g.cell, g.cell);

          const code = cols[c] + (3 - r);
          ctx.font = "700 11px Inter, sans-serif";
          ctx.fillStyle = dark ? "#94A3B8" : "#64748B";
          ctx.textAlign = "left";
          ctx.fillText(code, x + 5, y + 14);

          if (r === 1 && c === 1 && app.stepIdx >= 1) {
            ctx.font = "800 11px Inter, sans-serif";
            ctx.fillStyle = "#EF4444";
            ctx.textAlign = "center";
            ctx.fillText("ИЗОЛЯЦИЯ", x + g.cell / 2, y + g.cell / 2 + 4);
          }
        }
      }

      // Highlight valid jump targets if a knight is selected
      const validTargets = new Set();
      if (app.selectedKnightIdx !== null) {
        const i1 = (app.selectedKnightIdx + 1) % 8;
        const i2 = (app.selectedKnightIdx + 7) % 8;
        if (!app.knights[i1]) validTargets.add(i1);
        if (!app.knights[i2]) validTargets.add(i2);
      }

      // Draw Star lines on board if stepIdx >= 1
      if (app.stepIdx >= 1) {
        ctx.beginPath();
        for (let i = 0; i < 8; i++) {
          const n1 = g.nodes[i];
          const n2 = g.nodes[(i + 1) % 8];
          ctx.moveTo(n1.xBoard, n1.yBoard);
          ctx.lineTo(n2.xBoard, n2.yBoard);
        }
        ctx.strokeStyle = "rgba(0, 133, 255, 0.32)";
        ctx.lineWidth = 2.5;
        ctx.stroke();
      }

      // Draw Morphing Graph on the Right
      ctx.beginPath();
      for (let i = 0; i < 8; i++) {
        const n1 = g.nodes[i];
        const n2 = g.nodes[(i + 1) % 8];
        ctx.moveTo(n1.xRight, n1.yRight);
        ctx.lineTo(n2.xRight, n2.yRight);
      }
      ctx.strokeStyle = "#0085FF";
      ctx.lineWidth = 3.5;
      ctx.stroke();

      // Draw Knights and Valid Targets on Both Board & Right Graph
      for (const nd of g.nodes) {
        const k = app.knights[nd.idx];
        const isSel = app.selectedKnightIdx === nd.idx;
        const isTarget = validTargets.has(nd.idx);

        // Target highlight on board
        if (isTarget) {
          ctx.beginPath();
          ctx.arc(nd.xBoard, nd.yBoard, 17, 0, Math.PI * 2);
          ctx.fillStyle = "rgba(16, 185, 129, 0.25)";
          ctx.fill();
          ctx.strokeStyle = "#10B981";
          ctx.lineWidth = 2.5;
          ctx.stroke();
        }

        // Knight on board
        if (k) {
          ctx.beginPath();
          ctx.arc(nd.xBoard, nd.yBoard, 23, 0, Math.PI * 2);
          ctx.fillStyle = k === "W" ? "#FFFFFF" : "#0F172A";
          ctx.fill();
          ctx.strokeStyle = isSel ? "#0085FF" : (k === "W" ? "#0085FF" : "#F59E0B");
          ctx.lineWidth = isSel ? 4 : 2.5;
          ctx.stroke();

          ctx.font = "23px sans-serif";
          ctx.fillStyle = k === "W" ? "#0B192C" : "#FFFFFF";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(k === "W" ? "♘" : "♞", nd.xBoard, nd.yBoard + 1);
        }

        // Node on Right Graph
        ctx.beginPath();
        ctx.arc(nd.xRight, nd.yRight, 23, 0, Math.PI * 2);
        if (k) {
          ctx.fillStyle = k === "W" ? "#FFFFFF" : "#0F172A";
        } else if (isTarget) {
          ctx.fillStyle = "rgba(16, 185, 129, 0.22)";
        } else {
          ctx.fillStyle = dark ? "#1E293B" : "#FFFFFF";
        }
        ctx.fill();
        ctx.strokeStyle = isTarget ? "#10B981" : (isSel ? "#0085FF" : "#94A3B8");
        ctx.lineWidth = (isTarget || isSel) ? 3.5 : 2;
        ctx.stroke();

        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        if (k) {
          ctx.font = "21px sans-serif";
          ctx.fillStyle = k === "W" ? "#0B192C" : "#FFFFFF";
          ctx.fillText(k === "W" ? "♘" : "♞", nd.xRight, nd.yRight - 2);
          ctx.font = "800 10px Inter, sans-serif";
          ctx.fillStyle = "#0085FF";
          ctx.fillText(nd.code, nd.xRight, nd.yRight + 33);
        } else {
          ctx.font = "800 12px Inter, sans-serif";
          ctx.fillStyle = isTarget ? "#10B981" : (dark ? "#CBD5E1" : "#475569");
          ctx.fillText(nd.code, nd.xRight, nd.yRight);
        }
      }
      ctx.textBaseline = "alphabetic";
    }

    // ---- SCENE 2: K3,3 HOUSES & WELLS ----
    function renderK33() {
      const dark = isDark();
      const crossings = getK33Crossings();
      const crossEdgeSet = new Set();
      crossings.forEach(c => { crossEdgeSet.add(c.e1); crossEdgeSet.add(c.e2); });

      // Step 2: Fill hexagon inside region softly
      if (app.k33ShowRegions && app.k33Nodes.length === 6) {
        ctx.beginPath();
        app.k33Nodes.forEach((n, idx) => {
          if (idx === 0) ctx.moveTo(n.x, n.y);
          else ctx.lineTo(n.x, n.y);
        });
        ctx.closePath();
        ctx.fillStyle = "rgba(0, 133, 255, 0.08)";
        ctx.fill();
        ctx.font = "800 14px Nunito, sans-serif";
        ctx.fillStyle = "#0085FF";
        ctx.textAlign = "center";
        ctx.fillText("ВНУТРИ КОНТУРА", W / 2, H / 2);
      }

      // Draw Edges
      app.k33Edges.forEach(([u, v], idx) => {
        const n1 = app.k33Nodes.find(n => n.id === u);
        const n2 = app.k33Nodes.find(n => n.id === v);
        if (!n1 || !n2) return;
        const isBad = crossEdgeSet.has(idx);
        ctx.beginPath();
        ctx.moveTo(n1.x, n1.y);
        ctx.lineTo(n2.x, n2.y);
        ctx.strokeStyle = isBad ? "#EF4444" : "#10B981";
        ctx.lineWidth = isBad ? 3.5 : 3;
        ctx.stroke();
      });

      // Draw Crossing Markers
      crossings.forEach(c => {
        ctx.beginPath();
        ctx.arc(c.pt.x, c.pt.y, 13, 0, Math.PI * 2);
        ctx.fillStyle = "#EF4444";
        ctx.fill();
        ctx.font = "800 12px Inter, sans-serif";
        ctx.fillStyle = "#FFFFFF";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("✕", c.pt.x, c.pt.y + 1);
      });

      // Draw Nodes
      for (const nd of app.k33Nodes) {
        const isSel = app.k33SelectedNode === nd.id;
        ctx.beginPath();
        ctx.arc(nd.x, nd.y, 28, 0, Math.PI * 2);
        ctx.fillStyle = nd.type === "H" ? "#0085FF" : "#10B981";
        ctx.fill();
        ctx.strokeStyle = isSel ? "#F59E0B" : "#FFFFFF";
        ctx.lineWidth = isSel ? 4.5 : 2.5;
        ctx.stroke();

        ctx.font = "18px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#FFFFFF";
        ctx.fillText(nd.type === "H" ? "🏠" : "💧", nd.x, nd.y - 4);
        ctx.font = "800 11px Inter, sans-serif";
        ctx.fillText(nd.label, nd.x, nd.y + 13);
      }
      ctx.textBaseline = "alphabetic";

      // Helper banner at bottom
      ctx.font = "700 13px Inter, sans-serif";
      ctx.fillStyle = dark ? "#94A3B8" : "#475569";
      ctx.textAlign = "center";
      ctx.fillText("💡 Кликай от Домика к Колодцу (чтобы добавить/удалить тропинку) или перетаскивай кружки мышкой!", W / 2, H - 16);
    }

    // ---- SCENE 3: TREES & LEAF PRUNING ----
    function renderTrees() {
      const dark = isDark();
      const deg = getTreeDegrees();

      // Status banner at top of canvas
      const bannerFill = app.treeMsgType === "err" ? "rgba(239,68,68,0.12)" : (app.treeMsgType === "ok" ? "rgba(16,185,129,0.12)" : "rgba(0,133,255,0.1)");
      const bannerColor = app.treeMsgType === "err" ? "#EF4444" : (app.treeMsgType === "ok" ? "#059669" : "#0085FF");
      drawRoundRect(W * 0.08, 16, W * 0.84, 38, 10, bannerFill, bannerColor, 1.5);
      ctx.font = "800 13px Inter, sans-serif";
      ctx.fillStyle = bannerColor;
      ctx.textAlign = "center";
      ctx.fillText(app.treeMsg, W / 2, 40);

      // Edges
      for (const ed of app.treeEdges) {
        if (!ed.alive) continue;
        const u = app.treeNodes.find(n => n.id === ed.u);
        const v = app.treeNodes.find(n => n.id === ed.v);
        if (!u || !v) continue;
        const isLeafEdge = deg[u.id] === 1 || deg[v.id] === 1;
        ctx.beginPath();
        ctx.moveTo(u.x, u.y);
        ctx.lineTo(v.x, v.y);
        ctx.strokeStyle = isLeafEdge ? "#10B981" : "#0085FF";
        ctx.lineWidth = 3.5;
        ctx.stroke();
      }

      // Nodes
      for (const nd of app.treeNodes) {
        if (!nd.alive) continue;
        const d = deg[nd.id] || 0;
        const isLeaf = d === 1;
        ctx.beginPath();
        ctx.arc(nd.x, nd.y, 27, 0, Math.PI * 2);
        ctx.fillStyle = d === 0 ? "#F59E0B" : (isLeaf ? "#10B981" : "#0085FF");
        ctx.fill();
        ctx.strokeStyle = "#FFFFFF";
        ctx.lineWidth = 2.5;
        ctx.stroke();

        ctx.font = "800 12px Inter, sans-serif";
        ctx.fillStyle = "#FFFFFF";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(isLeaf ? "🍃 Лист " + nd.id : (d === 0 ? "🌟 Корень" : "Узел " + nd.id), nd.x, nd.y - 4);
        ctx.font = "700 10px Inter, sans-serif";
        ctx.fillText(isLeaf ? "клик → срезать" : `степень ${d}`, nd.x, nd.y + 11);
      }
      ctx.textBaseline = "alphabetic";
    }

    // ---- SCENE 4: TOURNAMENT KING ----
    function renderKing() {
      const k = app.kingSelected;
      const s1 = new Set();
      app.tourEdges.forEach(e => { if (e.u === k) s1.add(e.v); });
      const s2 = new Set();
      const relayEdges = new Set();
      app.tourEdges.forEach((e, idx) => {
        if (s1.has(e.u) && e.v !== k && !s1.has(e.v)) {
          s2.add(e.v);
          relayEdges.add(idx);
        }
      });

      const wins = {};
      app.tourNodes.forEach(n => wins[n.id] = 0);
      app.tourEdges.forEach(e => wins[e.u]++);

      // Draw Directed Edges
      app.tourEdges.forEach((e, idx) => {
        const u = app.tourNodes.find(n => n.id === e.u);
        const v = app.tourNodes.find(n => n.id === e.v);
        if (!u || !v) return;
        const isDirect = e.u === k;
        const isRelay = relayEdges.has(idx);
        const color = isDirect ? "#0085FF" : (isRelay ? "#10B981" : "rgba(148, 163, 184, 0.35)");
        const width = isDirect ? 3.4 : (isRelay ? 3.2 : 1.5);
        drawArrow(u.x, u.y, v.x, v.y, 29, color, width);
      });

      // Draw Nodes
      for (const nd of app.tourNodes) {
        const isKing = nd.id === k;
        const isStep1 = s1.has(nd.id);
        const isStep2 = s2.has(nd.id);
        ctx.beginPath();
        ctx.arc(nd.x, nd.y, 29, 0, Math.PI * 2);
        ctx.fillStyle = isKing ? "#F59E0B" : (isStep1 ? "#0085FF" : (isStep2 ? "#10B981" : "#EF4444"));
        ctx.fill();
        ctx.strokeStyle = "#FFFFFF";
        ctx.lineWidth = 2.5;
        ctx.stroke();

        ctx.fillStyle = "#FFFFFF";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.font = "800 12px Inter, sans-serif";
        ctx.fillText((isKing ? "👑 " : "") + nd.label, nd.x, nd.y - 5);
        ctx.font = "700 10px Inter, sans-serif";
        ctx.fillText(`${wins[nd.id]} поб.`, nd.x, nd.y + 10);
      }
      ctx.textBaseline = "alphabetic";
    }

    // ---- SCENE 5: ALGEBRA & PARAMETERS ----
    function renderAlgebra() {
      const tr = getAlgTransform();
      const dark = isDark();

      // Coordinate Grid
      ctx.lineWidth = 1;
      ctx.strokeStyle = dark ? "rgba(148,163,184,0.12)" : "rgba(148,163,184,0.22)";
      for (let gx = -8; gx <= 8; gx++) {
        ctx.beginPath();
        ctx.moveTo(tr.toX(gx), 0);
        ctx.lineTo(tr.toX(gx), H);
        ctx.stroke();
      }
      for (let gy = -5; gy <= 6; gy++) {
        ctx.beginPath();
        ctx.moveTo(0, tr.toY(gy));
        ctx.lineTo(W, tr.toY(gy));
        ctx.stroke();
      }

      // Axes
      ctx.strokeStyle = dark ? "#94A3B8" : "#475569";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, tr.oy); ctx.lineTo(W, tr.oy);
      ctx.moveTo(tr.ox, 0); ctx.lineTo(tr.ox, H);
      ctx.stroke();

      if (app.taskId === "a_mod") {
        // Plot y = (1-t)*(|x-1|-3) + t*||x-1|-3|
        const t = app.algBuildT;
        ctx.beginPath();
        for (let px = 0; px <= W; px += 3) {
          const x = tr.fromX(px);
          const raw = Math.abs(x - 1) - 3;
          const folded = Math.abs(raw);
          const y = (1 - t) * raw + t * folded;
          if (px === 0) ctx.moveTo(px, tr.toY(y));
          else ctx.lineTo(px, tr.toY(y));
        }
        ctx.strokeStyle = "#0085FF";
        ctx.lineWidth = 3.5;
        ctx.stroke();

        // Horizontal line y = a
        const py = tr.toY(app.algA);
        ctx.beginPath();
        ctx.moveTo(0, py); ctx.lineTo(W, py);
        ctx.strokeStyle = Math.abs(app.algA - 3) < 0.04 ? "#10B981" : "#F59E0B";
        ctx.lineWidth = 3;
        ctx.stroke();

        // Intersections
        const a = app.algA;
        const xs = [];
        if (a >= 0) {
          xs.push(1 - (3 + a), 1 + (3 + a));
          if (Math.abs(a - 3) < 0.04) xs.push(1);
          else if (a < 3) xs.push(1 - (3 - a), 1 + (3 - a));
        }
        xs.forEach(rx => {
          ctx.beginPath();
          ctx.arc(tr.toX(rx), py, 7.5, 0, Math.PI * 2);
          ctx.fillStyle = Math.abs(a - 3) < 0.04 ? "#10B981" : "#EF4444";
          ctx.fill();
          ctx.strokeStyle = "#FFFFFF";
          ctx.lineWidth = 2;
          ctx.stroke();
        });
      } else if (app.taskId === "a_pencil") {
        // Green sector between a=-0.6 and a=1.0
        const px = tr.toX(5), py = tr.toY(1);
        ctx.beginPath();
        ctx.moveTo(px, py);
        ctx.lineTo(tr.toX(-6), tr.toY(-0.6 * (-11) + 1));
        ctx.lineTo(tr.toX(-6), tr.toY(1.0 * (-11) + 1));
        ctx.closePath();
        ctx.fillStyle = "rgba(16, 185, 129, 0.11)";
        ctx.fill();

        // Diamond |x| + |y| = 4
        ctx.beginPath();
        ctx.moveTo(tr.toX(0), tr.toY(4));
        ctx.lineTo(tr.toX(4), tr.toY(0));
        ctx.lineTo(tr.toX(0), tr.toY(-4));
        ctx.lineTo(tr.toX(-4), tr.toY(0));
        ctx.closePath();
        ctx.fillStyle = "rgba(0, 133, 255, 0.08)";
        ctx.fill();
        ctx.strokeStyle = "#0085FF";
        ctx.lineWidth = 3.5;
        ctx.stroke();

        // Rotating line y = a(x - 5) + 1
        const a = app.algA;
        ctx.beginPath();
        ctx.moveTo(tr.toX(-7), tr.toY(a * (-12) + 1));
        ctx.lineTo(tr.toX(8), tr.toY(a * 3 + 1));
        ctx.strokeStyle = (a > -0.6 && a < 1.0) ? "#10B981" : "#F59E0B";
        ctx.lineWidth = 3;
        ctx.stroke();

        // Pivot P(5; 1)
        ctx.beginPath();
        ctx.arc(px, py, 8.5, 0, Math.PI * 2);
        ctx.fillStyle = "#F59E0B";
        ctx.fill();
        ctx.strokeStyle = "#FFFFFF";
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.font = "800 13px Inter, sans-serif";
        ctx.fillStyle = "#F59E0B";
        ctx.fillText("P(5; 1)", px + 28, py - 10);
      } else if (app.taskId === "a_circle") {
        // Angle y = |x|
        ctx.beginPath();
        ctx.moveTo(tr.toX(-6), tr.toY(6));
        ctx.lineTo(tr.toX(0), tr.toY(0));
        ctx.lineTo(tr.toX(6), tr.toY(6));
        ctx.strokeStyle = "#0085FF";
        ctx.lineWidth = 3.5;
        ctx.stroke();

        // Circle x^2 + (y - a)^2 = 9
        const cy = tr.toY(app.algA);
        ctx.beginPath();
        ctx.arc(tr.ox, cy, 3 * tr.sc, 0, Math.PI * 2);
        ctx.fillStyle = Math.abs(app.algA - 3) < 0.05 ? "rgba(16,185,129,0.14)" : "rgba(245,158,11,0.1)";
        ctx.fill();
        ctx.strokeStyle = Math.abs(app.algA - 3) < 0.05 ? "#10B981" : "#F59E0B";
        ctx.lineWidth = 3;
        ctx.stroke();

        // Center (0, a)
        ctx.beginPath();
        ctx.arc(tr.ox, cy, 7, 0, Math.PI * 2);
        ctx.fillStyle = "#0085FF";
        ctx.fill();
      }
    }

    // ---- SCENE 6: LOGIC RING (13 NUMBERS) ----
    function renderLogicRing() {
      const cx = W * 0.5, cy = H * 0.52, R = Math.min(W, H) * 0.34;

      // Draw Partition Arcs if enabled
      if (app.ringArcMode !== "none") {
        const arcs = app.ringArcMode === "weak" ? [[0, 3], [4, 7], [8, 11]] : [[1, 4], [5, 8], [9, 12]];
        arcs.forEach(([s, e]) => {
          const a1 = (s * 2 * Math.PI) / 13 - Math.PI / 2 - 0.12;
          const a2 = (e * 2 * Math.PI) / 13 - Math.PI / 2 + 0.12;
          ctx.beginPath();
          ctx.arc(cx, cy, R + 35, a1, a2);
          ctx.strokeStyle = app.ringArcMode === "exact" ? "#0085FF" : "#F59E0B";
          ctx.lineWidth = 8;
          ctx.lineCap = "round";
          ctx.stroke();
        });
        if (app.ringArcMode === "exact") {
          const a0 = -Math.PI / 2;
          ctx.beginPath();
          ctx.arc(cx + (R + 35) * Math.cos(a0), cy + (R + 35) * Math.sin(a0), 10, 0, Math.PI * 2);
          ctx.fillStyle = "#10B981";
          ctx.fill();
        }
      }

      // Draw Hover 4-Window
      const h = app.ringHoverIdx;
      const sum4 = app.ringVals[h] + app.ringVals[(h+1)%13] + app.ringVals[(h+2)%13] + app.ringVals[(h+3)%13];
      const ah1 = (h * 2 * Math.PI) / 13 - Math.PI / 2 - 0.14;
      const ah2 = ((h + 3) * 2 * Math.PI) / 13 - Math.PI / 2 + 0.14;
      ctx.beginPath();
      ctx.arc(cx, cy, R - 34, ah1, ah2);
      ctx.strokeStyle = sum4 > 0 ? "#10B981" : "#EF4444";
      ctx.lineWidth = 6;
      ctx.stroke();

      ctx.font = "800 16px Nunito, sans-serif";
      ctx.fillStyle = sum4 > 0 ? "#10B981" : "#EF4444";
      ctx.textAlign = "center";
      ctx.fillText(`Сумма четвёрки: ${sum4 > 0 ? "+" + sum4 : sum4}`, cx, cy);

      // Draw 13 Nodes
      for (let i = 0; i < 13; i++) {
        const ang = (i * 2 * Math.PI) / 13 - Math.PI / 2;
        const nx = cx + R * Math.cos(ang), ny = cy + R * Math.sin(ang);
        const v = app.ringVals[i];
        ctx.beginPath();
        ctx.arc(nx, ny, 23, 0, Math.PI * 2);
        ctx.fillStyle = v > 0 ? "#0085FF" : "#EF4444";
        ctx.fill();
        ctx.strokeStyle = "#FFFFFF";
        ctx.lineWidth = 2.5;
        ctx.stroke();

        ctx.font = "800 13px Inter, sans-serif";
        ctx.fillStyle = "#FFFFFF";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(v > 0 ? "+10" : "−1", nx, ny);
      }
      ctx.textBaseline = "alphabetic";
    }

    // ---- SCENE 7: LOGIC INVARIANT CARDS ----
    function renderLogicInv() {
      const dark = isDark();
      const cw = 165, ch = 125, gap = 36;
      const startX = (W - (3 * cw + 2 * gap)) / 2;
      const cy = H * 0.45 - ch / 2;

      ctx.font = "800 16px Nunito, sans-serif";
      ctx.fillStyle = dark ? "#E2E8F0" : "#0B192C";
      ctx.textAlign = "center";
      ctx.fillText(
        app.invSelectedCard === null
          ? "Кликни на первую карточку (x), а затем на вторую (y) для хода (x − y, 2y)!"
          : `Выбрано x = ${app.invNums[app.invSelectedCard]}. Теперь кликни на карточку y (она удвоится в 2y)!`,
        W / 2, cy - 38
      );

      for (let i = 0; i < 3; i++) {
        const rx = startX + i * (cw + gap);
        const val = app.invNums[i];
        const isEven = val % 2 === 0;
        const isSel = app.invSelectedCard === i;
        drawRoundRect(
          rx, cy, cw, ch, 18,
          dark ? "#1E293B" : "#FFFFFF",
          isSel ? "#0085FF" : (isEven ? "#10B981" : "#F59E0B"),
          isSel ? 4 : 2.5
        );

        ctx.font = "900 32px Nunito, sans-serif";
        ctx.fillStyle = dark ? "#F8FAFC" : "#0B192C";
        ctx.textAlign = "center";
        ctx.fillText(String(val), rx + cw / 2, cy + 62);

        ctx.font = "800 12px Inter, sans-serif";
        ctx.fillStyle = isEven ? "#10B981" : "#F59E0B";
        ctx.fillText(isEven ? "ЧЁТНОЕ" : "НЕЧЁТНОЕ", rx + cw / 2, cy + 98);

        if (app.invLastDoubleIdx === i) {
          ctx.fillStyle = "#10B981";
          ctx.fillText("✨ Получено как 2y!", rx + cw / 2, cy + ch + 24);
        }
      }
    }

    // ---- SCENE 8: LOGIC GAME 1xN ----
    function renderLogicGame() {
      const dark = isDark();
      const N = app.gameN;
      const pad = 42;
      const cellW = Math.min(44, (W - 2 * pad) / N);
      const startX = (W - N * cellW) / 2;
      const cy = H * 0.52;

      ctx.font = "800 15px Nunito, sans-serif";
      ctx.fillStyle = dark ? "#E2E8F0" : "#0B192C";
      ctx.textAlign = "center";
      ctx.fillText(app.gameStatusText, W / 2, cy - 68);

      for (let k = 1; k <= N; k++) {
        const rx = startX + (k - 1) * cellW;
        const isTrap = (N - k) % 4 === 0;
        const canJump = (k - app.gamePos >= 1 && k - app.gamePos <= 3);
        let fill = dark ? "#1E293B" : "#FFFFFF";
        let stroke = dark ? "#475569" : "#CBD5E1";

        if (app.gameShowTraps && isTrap) {
          fill = "rgba(239, 68, 68, 0.16)";
          stroke = "#EF4444";
        }
        if (canJump) {
          fill = "rgba(16, 185, 129, 0.18)";
          stroke = "#10B981";
        }

        drawRoundRect(rx + 2, cy - 26, cellW - 4, 52, 9, fill, stroke, canJump ? 2.5 : 1.5);

        ctx.font = "800 13px Inter, sans-serif";
        ctx.fillStyle = (app.gameShowTraps && isTrap) ? "#EF4444" : (dark ? "#CBD5E1" : "#334155");
        ctx.textAlign = "center";
        ctx.fillText(String(k), rx + cellW / 2, cy + 20);

        if (k === app.gamePos) {
          ctx.beginPath();
          ctx.arc(rx + cellW / 2, cy - 6, 12, 0, Math.PI * 2);
          ctx.fillStyle = "#0085FF";
          ctx.fill();
          ctx.strokeStyle = "#FFFFFF";
          ctx.lineWidth = 2;
          ctx.stroke();
        }
      }

      if (app.gameLastAiArch) {
        const { from, to, step, userStep } = app.gameLastAiArch;
        const x1 = startX + (from - 0.5) * cellW;
        const x2 = startX + (to - 0.5) * cellW;
        ctx.beginPath();
        ctx.moveTo(x1, cy - 28);
        ctx.quadraticCurveTo((x1 + x2) / 2, cy - 66, x2, cy - 28);
        ctx.strokeStyle = "#EF4444";
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.font = "800 12px Inter, sans-serif";
        ctx.fillStyle = "#EF4444";
        ctx.fillText(`ИИ: +${step} (дополнение 4 − ${userStep})`, (x1 + x2) / 2, cy - 52);
      }
    }

    // ---- SCENE 9: COMBINATORICS STARS & BARS ----
    function renderComboStars() {
      const dark = isDark();
      const cy = H * 0.36;
      const bars = getComboBarPositions();

      ctx.font = "800 15px Nunito, sans-serif";
      ctx.fillStyle = dark ? "#E2E8F0" : "#0B192C";
      ctx.textAlign = "center";
      ctx.fillText("Перетаскивай синие перегородки мышкой влево и вправо!", W / 2, cy - 56);

      if (!app.comboEmpty) {
        const span = Math.min(620, W - 140);
        const startX = (W - span) / 2;
        const step = span / 9;
        for (let i = 0; i < 10; i++) {
          const sx = startX + i * step;
          ctx.beginPath();
          ctx.arc(sx, cy, 17, 0, Math.PI * 2);
          ctx.fillStyle = "#0085FF";
          ctx.fill();
        }
      } else {
        const span = Math.min(660, W - 120);
        const startX = (W - span) / 2;
        const step = span / 12;
        const barSet = new Set(bars.map(b => b.slot));
        for (let s = 0; s < 13; s++) {
          if (barSet.has(s)) continue;
          const sx = startX + s * step;
          ctx.beginPath();
          ctx.arc(sx, cy, 16, 0, Math.PI * 2);
          ctx.fillStyle = "#0085FF";
          ctx.fill();
        }
      }

      // Draw 3 Draggable Bars
      bars.forEach(b => {
        drawRoundRect(b.x - 5, cy - 34, 10, 68, 5, "#F59E0B", "#FFFFFF", 2);
      });

      // Draw 4 Category Boxes at bottom
      const bw = 135, bh = 78, gap = 24;
      const bx0 = (W - (4 * bw + 3 * gap)) / 2;
      const by = H * 0.65;
      app.comboCounts.forEach((cnt, idx) => {
        const rx = bx0 + idx * (bw + gap);
        drawRoundRect(rx, by, bw, bh, 14, dark ? "#1E293B" : "#FFFFFF", cnt === 0 ? "#EF4444" : "#0085FF", 2);
        ctx.font = "700 12px Inter, sans-serif";
        ctx.fillStyle = dark ? "#94A3B8" : "#64748B";
        ctx.textAlign = "center";
        ctx.fillText(`Вид ${idx + 1}`, rx + bw / 2, by + 24);
        ctx.font = "900 24px Nunito, sans-serif";
        ctx.fillStyle = cnt === 0 ? "#EF4444" : (dark ? "#F8FAFC" : "#0B192C");
        ctx.fillText(`x${idx + 1} = ${cnt}`, rx + bw / 2, by + 58);
      });
    }

    // ---- SCENE 10: COMBINATORICS PAIRS / CHESS TABLES ----
    function renderComboPairs() {
      const dark = isDark();
      const tw = 175, th = 120, gap = 42;
      const startX = (W - (3 * tw + 2 * gap)) / 2;
      const cy = H * 0.48 - th / 2;

      ctx.font = "800 15px Nunito, sans-serif";
      ctx.fillStyle = dark ? "#E2E8F0" : "#0B192C";
      ctx.textAlign = "center";
      ctx.fillText("Кликни по любому столу, чтобы поменять игроков местами внутри пары!", W / 2, cy - 36);

      app.pairPlayers.forEach((pair, idx) => {
        const rx = startX + idx * (tw + gap);
        drawRoundRect(rx, cy, tw, th, 16, dark ? "#1E293B" : "#FFFFFF", app.pairGlueTab ? "#10B981" : "#0085FF", 2.5);
        ctx.font = "800 12px Inter, sans-serif";
        ctx.fillStyle = app.pairGlueTab ? "#10B981" : "#0085FF";
        ctx.textAlign = "center";
        ctx.fillText(app.pairGlueTab ? "Стол (без номера)" : `Стол №${idx + 1}`, rx + tw / 2, cy + 26);

        ctx.font = "900 26px Nunito, sans-serif";
        ctx.fillStyle = dark ? "#F8FAFC" : "#0B192C";
        ctx.fillText(app.pairGlueIn ? `{ ${pair[0]}, ${pair[1]} }` : `${pair[0]} ↔ ${pair[1]}`, rx + tw / 2, cy + 74);
      });
    }

    // ---- SCENE 11: PLANIMETRY (MEDIAN & AUXILIARY CIRCLE) ----
    function renderPlanimetry() {
      const dark = isDark();
      if (app.taskId === "m_median") {
        const A = app.geomA, B = app.geomB, C = app.geomC;
        const M = { x: (A.x + C.x) / 2, y: (A.y + C.y) / 2 };

        // Base Triangle ABC
        ctx.beginPath();
        ctx.moveTo(A.x, A.y); ctx.lineTo(B.x, B.y); ctx.lineTo(C.x, C.y); ctx.closePath();
        ctx.fillStyle = "rgba(0, 133, 255, 0.08)";
        ctx.fill();
        ctx.strokeStyle = "#0085FF";
        ctx.lineWidth = 3;
        ctx.stroke();

        // Median BM
        ctx.beginPath();
        ctx.moveTo(B.x, B.y); ctx.lineTo(M.x, M.y);
        ctx.strokeStyle = "#10B981";
        ctx.lineWidth = 3.5;
        ctx.stroke();

        // Rotated Triangle M A' B' around M by angle pi * geomRot
        if (app.geomRot > 0.01) {
          const ang = app.geomRot * Math.PI;
          const rot = P => ({
            x: M.x + (P.x - M.x) * Math.cos(ang) - (P.y - M.y) * Math.sin(ang),
            y: M.y + (P.x - M.x) * Math.sin(ang) + (P.y - M.y) * Math.cos(ang)
          });
          const A2 = rot(A), B2 = rot(B);
          ctx.beginPath();
          ctx.moveTo(M.x, M.y); ctx.lineTo(A2.x, A2.y); ctx.lineTo(B2.x, B2.y); ctx.closePath();
          ctx.fillStyle = "rgba(16, 185, 129, 0.16)";
          ctx.fill();
          ctx.strokeStyle = "#10B981";
          ctx.lineWidth = 3;
          ctx.stroke();

          ctx.font = "800 14px Inter, sans-serif";
          ctx.fillStyle = "#10B981";
          ctx.fillText("D", B2.x + 14, B2.y + 14);
        }

        // Vertices
        [[A, "A"], [B, "B"], [C, "C"], [M, "M"]].forEach(([pt, lb]) => {
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, 8, 0, Math.PI * 2);
          ctx.fillStyle = lb === "M" ? "#10B981" : "#0085FF";
          ctx.fill();
          ctx.font = "800 14px Inter, sans-serif";
          ctx.fillStyle = dark ? "#F8FAFC" : "#0B192C";
          ctx.fillText(lb, pt.x - 16, pt.y - 12);
        });
      } else if (app.taskId === "m_circle") {
        const A = app.cirA, B = app.cirB, D = app.cirD, C = app.cirC;
        const circ = getCircumcircle(A, B, D);
        const angB = angleDeg(A, B, D);
        const angC = angleDeg(A, C, D);
        const onCirc = Math.abs(angB - angC) < 1.5;

        if (circ) {
          ctx.beginPath();
          ctx.arc(circ.x, circ.y, circ.r, 0, Math.PI * 2);
          ctx.strokeStyle = onCirc ? "#10B981" : "rgba(0, 133, 255, 0.35)";
          ctx.lineWidth = onCirc ? 3.5 : 2;
          ctx.setLineDash(onCirc ? [] : [7, 6]);
          ctx.stroke();
          ctx.setLineDash([]);
        }

        // Segments AB, BD, AC, CD, AD, BC
        [[A,B],[B,D],[A,C],[C,D],[A,D],[B,C]].forEach(([p1, p2]) => {
          ctx.beginPath();
          ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y);
          ctx.strokeStyle = "#0085FF";
          ctx.lineWidth = 2.5;
          ctx.stroke();
        });

        [[A,"A"],[B,"B"],[C,"C (тяни меня!)"],[D,"D"]].forEach(([pt, lb]) => {
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, pt === C ? 11 : 8, 0, Math.PI * 2);
          ctx.fillStyle = pt === C ? (onCirc ? "#10B981" : "#F59E0B") : "#0085FF";
          ctx.fill();
          ctx.font = "800 13px Inter, sans-serif";
          ctx.fillStyle = dark ? "#F8FAFC" : "#0B192C";
          ctx.fillText(lb, pt.x + 12, pt.y - 10);
        });
      }
    }

    // ---- MASTER 60-FPS LOOP ----
    function renderFrame() {
      ctx.clearRect(0, 0, W, H);

      if (app.taskId === "knights") renderKnights();
      else if (app.taskId === "k33") renderK33();
      else if (app.taskId === "trees") renderTrees();
      else if (app.taskId === "king") renderKing();
      else if (app.taskId === "a_mod" || app.taskId === "a_pencil" || app.taskId === "a_circle") renderAlgebra();
      else if (app.taskId === "l_ring") renderLogicRing();
      else if (app.taskId === "l_inv") renderLogicInv();
      else if (app.taskId === "l_game") renderLogicGame();
      else if (app.taskId === "c_stars") renderComboStars();
      else if (app.taskId === "c_pairs") renderComboPairs();
      else if (app.taskId === "m_median" || app.taskId === "m_circle") renderPlanimetry();

      // Render active pulse rings
      for (let i = app.rings.length - 1; i >= 0; i--) {
        const rg = app.rings[i];
        rg.r += (rg.maxR - rg.r) * 0.14;
        rg.alpha *= 0.91;
        ctx.beginPath();
        ctx.arc(rg.x, rg.y, rg.r, 0, Math.PI * 2);
        ctx.strokeStyle = rg.color;
        ctx.globalAlpha = rg.alpha;
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.globalAlpha = 1;
        if (rg.alpha < 0.04) app.rings.splice(i, 1);
      }

      // Render active flying particles
      for (let i = app.particles.length - 1; i >= 0; i--) {
        const pt = app.particles[i];
        pt.t += pt.step;
        const k = Math.min(1, pt.t);
        const x = pt.x0 + (pt.x1 - pt.x0) * k;
        const y = pt.y0 + (pt.y1 - pt.y0) * k;
        ctx.beginPath();
        ctx.arc(x, y, 7, 0, Math.PI * 2);
        ctx.fillStyle = pt.color;
        ctx.fill();
        if (pt.t >= 1) {
          if (pt.onDone) pt.onDone();
          app.particles.splice(i, 1);
        }
      }

      requestAnimationFrame(renderFrame);
    }

    // =========================================================================
    // 8. BOOTSTRAP & EVENT LISTENERS
    // =========================================================================
    document.getElementById("btnPrev").addEventListener("click", () => {
      if (app.stepIdx > 0) selectStep(app.stepIdx - 1);
    });

    document.getElementById("btnNext").addEventListener("click", () => {
      const task = getTask();
      if (app.stepIdx < task.steps.length - 1) selectStep(app.stepIdx + 1);
      else selectStep(0);
    });

    document.getElementById("themeBtn").addEventListener("click", () => {
      const cur = document.body.getAttribute("data-theme");
      const next = cur === "dark" ? "light" : "dark";
      document.body.setAttribute("data-theme", next);
      document.getElementById("themeBtn").textContent = next === "dark" ? "☀️ День" : "🌙 Ночь";
    });

    window.addEventListener("DOMContentLoaded", () => {
      initTaskDefaults();
      syncUI();
      requestAnimationFrame(renderFrame);
    });
  </script>
</body>
</html>
